# Compila los instaladores de Windows (Nodo Sur POS, Nodo Sur Servicios y, a mano, Nodo Gastro), los firma para el actualizador y los publica en el canal BETA de horsepos.com:
# desde ahí la bajan las cuentas de administrador en horsepos.com/descargar/ y la reciben por actualización automática.
# Se publica SOLO cuando se pide (2026-10-03: "no quiero más despliegues por publicar una cosa chica"):
#   * a mano: Actions → "publicar-beta" → Run workflow (beta o stable, y qué app: las dos, una sola o todas);
#   * o al mergear con un título que empieza con "release:" (estable) o "beta:" (beta).
# Un merge común a main NO publica nada: se acumulan los cambios y se publican juntos cuando vos decidís.
#
# Secretos que tiene que tener el repositorio (Settings → Secrets and variables → Actions):
#   RELEASE_TOKEN          el mismo valor que el secreto del Worker (registra la versión en el sitio)
#   CLOUDFLARE_API_TOKEN   token de Cloudflare con permiso de editar R2 (sube el instalador al bucket nodosur-releases)
#   CLOUDFLARE_ACCOUNT_ID  id de la cuenta de Cloudflare
#   DSA_PRIVATE_KEY        el CONTENIDO de dsa_priv.pem (firma de actualizaciones; si se pierde no hay más actualizaciones)
# Opcionales:
#   SIGN_PFX_BASE64 / SIGN_PFX_PASSWORD   certificado de firma de código (.pfx en base64) y su contraseña
#   SITE_REPO_TOKEN        solo si el repo del sitio (NodoSurPage) es privado: un token con permiso de lectura
name: publicar-beta

on:
  # Un merge a main solo publica si el título del PR empieza con "release:" (ESTABLE: le llega a los clientes) o con "beta:"
  # (BETA: solo administradores); el commit del merge conserva el título. Cualquier otro merge no hace nada (la corrida
  # figura como omitida). También se puede correr a mano eligiendo canal. Los commits de este workflow llevan [skip ci].
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      canal:
        description: "beta = solo administradores (prueba). stable = les llega a los clientes por actualización automática"
        required: true
        type: choice
        options: [beta, stable]
        default: beta
      notas:
        description: Qué cambió (se ve en las notas de la versión)
        required: true
        default: Versión de prueba
      rollout:
        description: Porcentaje de las PC con acceso (en beta dejá 100; en stable conviene empezar bajo y subirlo desde /admin/)
        required: true
        default: '100'
      edicion:
        # Nodo Gastro (docs/PLAN-GASTRONOMIA.md) sale solo a mano, con "gastronomia" o "todas", como su APK: un merge no la publica.
        description: "Qué app publicar: ambas (almacén y Servicios), una sola, o todas (con Nodo Gastro)"
        required: true
        type: choice
        options: [ambas, servicios, almacen, gastronomia, todas]
        default: ambas

# Una publicación a la vez: dos corridas juntas subirían el mismo número de compilación.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  beta:
    # Sin esto, cada merge compilaba y publicaba una versión nueva (6 minutos de máquina y un instalador de 13 MB más en el sitio).
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'beta:')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DSA_PRIVATE_KEY: ${{ secrets.DSA_PRIVATE_KEY }}
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
      # Al disparar por merge no hay inputs: canal según el título (release: → stable, beta: → beta), al 100 %, y el título como nota.
      NOTAS: ${{ inputs.notas || github.event.head_commit.message || 'Versión de prueba' }}
      CANAL: ${{ inputs.canal || (startsWith(github.event.head_commit.message, 'release:') && 'stable') || 'beta' }}
      ROLLOUT: ${{ inputs.rollout || '100' }}
      # Un merge "release:"/"beta:" publica las dos; a mano se elige (El dueño, 2026-10-16: una beta de Servicios no tiene por
      # qué mandarle una versión nueva a los almacenes).
      EDICION: ${{ inputs.edicion || 'ambas' }}
    steps:
      - name: Comprobar que están los secretos (antes de compilar nada)
        shell: pwsh
        run: |
          $faltan = @('RELEASE_TOKEN', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'DSA_PRIVATE_KEY') |
            Where-Object { -not (Get-Item "env:$_" -ErrorAction SilentlyContinue).Value }
          if ($faltan) { throw "Faltan secretos del repositorio: $($faltan -join ', '). Mirá el encabezado de este archivo." }
          if ($env:ROLLOUT -notmatch '^\d{1,3}$' -or [int]$env:ROLLOUT -lt 1 -or [int]$env:ROLLOUT -gt 100) { throw "El porcentaje tiene que ser un número de 1 a 100." }

      # Siempre la punta de main al momento de correr (no el commit que disparó): si hay dos merges seguidos, la
      # segunda corrida ya ve el número de compilación que subió la primera y no intenta publicar el mismo.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # El script que registra la versión en el sitio (publicar-release.mjs) vive en el repo del sitio.
      - uses: actions/checkout@v4
        with:
          repository: neaserisgod/NodoSurPage
          path: sitio
          token: ${{ secrets.SITE_REPO_TOKEN || github.token }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Wrangler
        run: npm install -g wrangler

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Claves de firma (se escriben afuera del repo y se borran al terminar el trabajo)
        shell: pwsh
        run: |
          $dsa = Join-Path $env:RUNNER_TEMP 'dsa_priv.pem'
          Set-Content -Path $dsa -Value $env:DSA_PRIVATE_KEY -Encoding ascii
          "DSA_PRIVATE_KEY_PATH=$dsa" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:SIGN_PFX_BASE64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'firma.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
            "SIGN_PFX_PATH=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Host "Sin certificado de firma de código: el instalador sale sin firmar (SmartScreen va a avisar)."
          }

      - run: flutter pub get

      # Sube el número de compilación en pubspec.yaml, compila, arma y firma el instalador, lo firma para el
      # actualizador y lo sube al canal beta: es el mismo script que se usa desde la PC.
      - name: Compilar y publicar la beta
        if: env.EDICION != 'servicios' && env.EDICION != 'gastronomia'
        shell: pwsh
        env:
          NODOSUR_SCRIPTS: ${{ github.workspace }}\sitio\scripts
          SITE_URL: https://broad-frog-1e4b.gtalovergamer.workers.dev
        run: .\tool\publicar_release.ps1 -Notas $env:NOTAS -Canal $env:CANAL -Rollout ([int]$env:ROLLOUT)

      - name: Guardar el instalador también como archivo de la corrida
        if: env.EDICION != 'servicios' && env.EDICION != 'gastronomia'
        uses: actions/upload-artifact@v4
        with:
          name: instalador-beta
          path: dist/NodoSurPOS-Setup-*.exe
          retention-days: 14

      # El script subió el número de compilación: hay que dejarlo en el repo, o la próxima corrida intentaría publicar el mismo.
      - name: Guardar el nuevo número de compilación en el repositorio
        if: env.EDICION != 'servicios' && env.EDICION != 'gastronomia'
        shell: pwsh
        run: .\tool\guardar_numero_publicado.ps1

      # Nodo Sur Servicios para Windows (docs/PLAN-ESCRITORIO-SERVICIOS.md): el mismo número, su propio instalador y su feed
      # (windows-servicios). Va después de guardar el número a propósito: si esto falla, la de almacén ya quedó publicada.
      # El bot de WhatsApp que va adentro (repo botdemo): el mismo del Android, con el Node de Windows.
      - uses: actions/checkout@v4
        if: env.EDICION != 'almacen'
        with:
          repository: neaserisgod/botdemo
          path: botdemo
      - name: Node y el bot (servicios y gastronomía)
        if: env.EDICION != 'almacen'
        shell: pwsh
        env:
          BOT_DIR: ${{ github.workspace }}\botdemo
        run: .\tool\preparar_bot_windows.ps1

      # Con las dos, usa el número que ya subió la de almacén; sola, sube el suyo y lo guarda.
      - name: Compilar y publicar Nodo Sur Servicios para Windows
        if: contains(fromJSON('["ambas","servicios","todas"]'), env.EDICION)
        shell: pwsh
        env:
          NODOSUR_SCRIPTS: ${{ github.workspace }}\sitio\scripts
          SITE_URL: https://broad-frog-1e4b.gtalovergamer.workers.dev
        run: |
          $extra = if ($env:EDICION -ne 'servicios') { @{ SinSubirBuild = $true } } else { @{} }
          .\tool\publicar_release.ps1 -Notas $env:NOTAS -Canal $env:CANAL -Rollout ([int]$env:ROLLOUT) -Edicion servicios @extra

      - name: Guardar el nuevo número de compilación en el repositorio (solo Servicios)
        if: env.EDICION == 'servicios'
        shell: pwsh
        run: .\tool\guardar_numero_publicado.ps1

      - name: Guardar el instalador de Nodo Sur Servicios como archivo de la corrida
        if: contains(fromJSON('["ambas","servicios","todas"]'), env.EDICION)
        uses: actions/upload-artifact@v4
        with:
          name: instalador-servicios
          path: dist/NodoSurServicios-Setup-*.exe
          retention-days: 14

      # Nodo Gastro para Windows: igual que Servicios, con su instalador y su feed (windows-gastronomia). Con "todas" usa el
      # número que ya subió la de almacén; sola, sube el suyo y lo guarda.
      - name: Compilar y publicar Nodo Gastro para Windows
        if: contains(fromJSON('["gastronomia","todas"]'), env.EDICION)
        shell: pwsh
        env:
          NODOSUR_SCRIPTS: ${{ github.workspace }}\sitio\scripts
          SITE_URL: https://broad-frog-1e4b.gtalovergamer.workers.dev
        run: |
          $extra = if ($env:EDICION -eq 'todas') { @{ SinSubirBuild = $true } } else { @{} }
          .\tool\publicar_release.ps1 -Notas $env:NOTAS -Canal $env:CANAL -Rollout ([int]$env:ROLLOUT) -Edicion gastronomia @extra

      - name: Guardar el nuevo número de compilación en el repositorio (solo Nodo Gastro)
        if: env.EDICION == 'gastronomia'
        shell: pwsh
        run: .\tool\guardar_numero_publicado.ps1

      - name: Guardar el instalador de Nodo Gastro como archivo de la corrida
        if: contains(fromJSON('["gastronomia","todas"]'), env.EDICION)
        uses: actions/upload-artifact@v4
        with:
          name: instalador-gastronomia
          path: dist/NodoGastro-Setup-*.exe
          retention-days: 14

      - name: Borrar las claves
        if: always()
        shell: pwsh
        run: |
          foreach ($f in 'dsa_priv.pem', 'firma.pfx') { Remove-Item (Join-Path $env:RUNNER_TEMP $f) -Force -ErrorAction SilentlyContinue }
