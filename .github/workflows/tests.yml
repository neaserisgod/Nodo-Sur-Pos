# Corre el análisis y los tests en cada PR y en cada push a main. Linux alcanza: los tests no dependen de Windows
# (lo específico de Windows —instalador, ventana— no se prueba acá, salvo que compile Nodo Sur Servicios para Windows). NO publica nada.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# Solo lectura: estos pasos no necesitan escribir nada en el repo (revisión 2026-10-04).
permissions:
  contents: read

# Un push nuevo al mismo PR cancela la corrida vieja: nadie mira el resultado de un commit que ya quedó atrás.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # para comparar contra la rama base del PR
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      # Todo el repo (app, tests y herramientas) tiene que dar "No issues found!" (limpiado el 2026-10-03): un aviso nuevo
      # frena el PR en vez de acumularse.
      - name: Análisis (sin avisos)
        run: flutter analyze
      # Los scripts de PowerShell (instalador, publicación) solo corren al publicar: un error de sintaxis aparecía recién ahí
      # (2026-10-15, "$origenBot:" frenó una beta). El runner de Ubuntu trae pwsh.
      - name: Scripts de PowerShell (sintaxis)
        shell: pwsh
        run: |
          $mal = 0
          foreach ($f in Get-ChildItem tool -Filter *.ps1) {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$e)
            foreach ($x in $e) { Write-Host "::error file=tool/$($f.Name),line=$($x.Extent.StartLineNumber)::$($x.Message)"; $mal++ }
          }
          if ($mal) { exit 1 }
      # Sin el benchmark de 60.000 ventas (`@Tags(['bench'])`): mide rendimiento, no correctitud, y se corre aparte con
      # `flutter test --tags bench`. Las capturas van en su versión corta (claro, 1366; `test/helpers/capturas.dart`).
      # En un PR, solo los tests que pueden cambiar por lo tocado (`tool/tests_afectados.dart`, sigue los imports); en main,
      # la suite entera, que es la red de seguridad de lo que el grafo no ve.
      - name: Tests afectados (PR)
        if: github.event_name == 'pull_request'
        run: dart run tool/tests_afectados.dart --base origin/${{ github.base_ref }} --correr -- --reporter failures-only
      - name: Tests (suite entera)
        if: github.event_name != 'pull_request'
        run: flutter test --exclude-tags bench --reporter failures-only

  # Nodo Sur Servicios en el navegador (`docs/PLAN-WEB-SERVICIOS.md`): que siga compilando para web. El análisis no lo ve: una
  # pantalla del celular que importe algo nativo (sqlite3, dart:ffi) anda en Android y rompe solo la compilación web.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Un PR que no toca código (documentos, workflows de otra cosa) no puede romper la compilación web: se saltea.
      - name: ¿Cambió algo que compila?
        id: cambios
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(lib/|web/|pubspec\.|tool/preparar_web\.sh)'; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.cambios.outputs.compilar == 'true'
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - if: steps.cambios.outputs.compilar == 'true'
        run: flutter pub get
      - if: steps.cambios.outputs.compilar == 'true'
        run: bash tool/preparar_web.sh
      - name: Compila para web
        if: steps.cambios.outputs.compilar == 'true'
        run: flutter build web --release -t lib/main_web.dart --base-href /app/ --no-web-resources-cdn --pwa-strategy=none

  # Nodo Sur Servicios para Windows (`docs/PLAN-ESCRITORIO-SERVICIOS.md`): la otra edición del mismo proyecto de Windows (otro
  # .exe, nombre, ícono y mutex por `NODOSUR_EDICION`). Que compile y que el .exe salga con su nombre: Linux no lo ve. Solo
  # cuando se toca lo que la arma (corre en Windows, que es más lento y caro).
  windows-servicios:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ¿Cambió algo de la edición de Windows?
        id: cambios
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || \
             git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -qE '^(windows/|installer/|tool/preparar_bot_windows\.ps1|lib/main\.dart|lib/edicion\.dart|lib/plataforma\.dart|lib/data/carpeta_base\.dart|pubspec\.)'; then
            echo "compilar=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.cambios.outputs.compilar == 'true'
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - if: steps.cambios.outputs.compilar == 'true'
        run: flutter pub get
      - name: Compila Nodo Sur Servicios para Windows
        if: steps.cambios.outputs.compilar == 'true'
        shell: pwsh
        env:
          NODOSUR_EDICION: servicios
        run: |
          flutter build windows --release --dart-define=EDICION=servicios
          if ($LASTEXITCODE -ne 0) { throw "No compiló" }
          $exe = "build\windows\x64\runner\Release\nodo_sur_servicios.exe"
          if (-not (Test-Path $exe)) { throw "No salió $exe" }
          $info = (Get-Item $exe).VersionInfo
          if ($info.ProductName -ne "Nodo Sur Servicios") { throw "ProductName es '$($info.ProductName)': la carpeta de datos sería la de otra app" }
          Write-Host "OK: $exe ($($info.ProductName))"
      # El bot que va adentro (repo botdemo) con el Node de Windows: que el script que lo arma siga andando.
      - uses: actions/checkout@v4
        if: steps.cambios.outputs.compilar == 'true'
        with:
          repository: neaserisgod/botdemo
          path: botdemo
      - uses: actions/setup-node@v4
        if: steps.cambios.outputs.compilar == 'true'
        with:
          node-version: 22
      - name: Arma Node y el bot para Windows
        if: steps.cambios.outputs.compilar == 'true'
        shell: pwsh
        env:
          BOT_DIR: ${{ github.workspace }}\botdemo
        run: |
          .\tool\preparar_bot_windows.ps1
          foreach ($f in "node.exe", "bot.zip") { if (-not (Test-Path "build\bot-windows\$f")) { throw "Falta $f" } }
