# Corre el análisis y los tests en cada PR y en cada push a main. Linux alcanza: los tests no dependen de Windows
# (lo específico de Windows —instalador, ventana— no se prueba acá). NO publica nada.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Análisis (solo errores; los avisos no frenan)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - name: Tests
        run: flutter test
