# Compila el APK de la companion app (celular) y lo publica en el sitio (Cloudflare) como plataforma "android".
# El celular lo busca ahí al abrir el menú (lib/companion/actualizacion.dart). Se dispara:
#   * al mergear con un título que empieza con "release:" (estable) o "beta:" (beta), A LA VEZ que Windows (2026-10-09: el
#     celular salía siempre después, a mano, y un negocio de servicios usa solo el celular);
#   * o a mano: Actions → publicar-apk → Run workflow.
# Tiene su propia fila de publicación: no comparte nada con Windows (en el sitio cada plataforma es un registro aparte y su
# archivo va a otra ruta de R2), y este workflow no escribe en el repo.
#
# Secretos (los mismos de publicar-beta, más uno):
#   RELEASE_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   ANDROID_KEYSTORE_BASE64  el debug.keystore de la PC donde se compiló el APK que ya está instalado en el celular
#                            (Windows: %USERPROFILE%\.android\debug.keystore), en base64. SIN este secreto el APK sale con
#                            otra firma y Android se niega a instalarlo encima del anterior.
#                            PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))
# Opcional: SITE_REPO_TOKEN si el repo del sitio es privado.
#
# Número de compilación: sin el dato "build", el mayor entre el que va a publicar Windows (el de pubspec.yaml + 1, que
# publicar-beta sube en paralelo) y el último APK publicado en ese canal + 1. Android no deja instalar una versión más vieja
# encima de una más nueva, así que nunca puede quedar por debajo del último APK. Con "build" se usa ese número tal cual.
name: publicar-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      canal:
        description: "beta = solo administradores. stable = a todos"
        required: true
        type: choice
        options: [beta, stable]
        default: stable
      notas:
        description: Qué cambió
        required: true
        default: Actualización de la companion
      build:
        description: "Opcional: número de compilación propio del APK (ej. 2125). Vacío = el de pubspec.yaml. Mayor que el último APK publicado"
        required: false
        default: ""
      rollout:
        description: "Porcentaje de celulares que la reciben (1-100). Conviene 10 y subirlo desde /admin → Versiones; 100 = a todos"
        required: true
        default: "100"

concurrency:
  group: publicar-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    # Un merge común no publica nada (como publicar-beta): solo los "release:" y "beta:".
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'beta:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SITE_URL: https://broad-frog-1e4b.gtalovergamer.workers.dev
      # Al disparar por merge no hay inputs: canal según el título (release: → stable, beta: → beta), al 100 %, y la primera
      # línea del título como nota.
      CANAL: ${{ inputs.canal || (startsWith(github.event.head_commit.message, 'release:') && 'stable') || 'beta' }}
      ROLLOUT: ${{ inputs.rollout || '100' }}
      BUILD: ${{ inputs.build }}
      MENSAJE: ${{ inputs.notas || github.event.head_commit.message || 'Actualización de la companion' }}
    steps:
      - name: Comprobar secretos
        run: |
          for v in RELEASE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANDROID_KEYSTORE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Falta el secreto $v (mirá el encabezado del workflow)"; exit 1; }
          done

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neaserisgod/NodoSurPage
          path: sitio
          token: ${{ secrets.SITE_REPO_TOKEN || github.token }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler

      - name: Keystore (afuera del repo)
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Número de compilación
        run: |
          if [ -n "$BUILD" ]; then
            [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build tiene que ser un número entero (recibí '$BUILD')"; exit 1; }
            numero="$BUILD"
          else
            pubspec=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*[^+]*\+//')
            # El último APK publicado en CUALQUIER canal (un administrador recibe también las beta), según el registro del sitio.
            ultimo=$(curl -fsS -A "Mozilla/5.0 (publicar-apk)" -H "Authorization: Bearer $RELEASE_TOKEN" -H "X-Release-Token: $RELEASE_TOKEN" "$SITE_URL/api/admin/releases" \
              | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{let m=0;
                  for(const r of JSON.parse(t).releases||[]) if(r.platform==="android"){const b=+String(r.version).split("+")[1]||0;if(b>m)m=b}
                  console.log(m)})') \
              || { echo "::error::No se pudo leer el último APK publicado del sitio: no se compila con un número que podría ser viejo"; exit 1; }
            numero=$(( pubspec + 1 > ultimo + 1 ? pubspec + 1 : ultimo + 1 ))
            echo "pubspec +1 = $((pubspec + 1)) · último APK publicado = $ultimo → $numero"
          fi
          echo "NUMERO=$numero" >> "$GITHUB_ENV"
          echo "NOTAS=$(printf '%s' "$MENSAJE" | head -n 1)" >> "$GITHUB_ENV"

      # Un solo APK arm64, sin --split-per-abi: con split Flutter suma 2000 al build number y la comparación de versiones se rompe
      # (ver tool/publicar_actualizacion_companion.sh).
      - name: Compilar el APK
        run: flutter build apk --release --target-platform android-arm64 --build-number "$NUMERO"

      - name: Publicar en el sitio
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          # La versión publicada lleva el número que quedó adentro del APK.
          version="${version%%+*}+${NUMERO}"
          cp build/app/outputs/flutter-apk/app-release.apk "NodoSurPOS-Companion-${version}.apk"
          node sitio/scripts/publicar-release.mjs --file "NodoSurPOS-Companion-${version}.apk" --platform android \
            --channel "$CANAL" --version "$version" --notes "$NOTAS" --rollout "$ROLLOUT"
