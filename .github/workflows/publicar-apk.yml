# Compila los dos APK del celular y los publica en el sitio (Cloudflare): la companion de almacén como plataforma "android" y
# Nodo Sur Servicios (con el bot de WhatsApp adentro, `docs/PLAN-APP-SERVICIOS.md`) como "android-servicios".
# El celular lo busca ahí al abrir el menú (lib/companion/actualizacion.dart). Se dispara:
#   * al mergear con un título que empieza con "release:" (estable) o "beta:" (beta), A LA VEZ que Windows (2026-10-09: el
#     celular salía siempre después, a mano, y un negocio de servicios usa solo el celular);
#   * o a mano: Actions → publicar-apk → Run workflow.
# Tiene su propia fila de publicación: no comparte nada con Windows (en el sitio cada plataforma es un registro aparte y su
# archivo va a otra ruta de R2), y este workflow no escribe en el repo.
#
# Secretos (los mismos de publicar-beta, más uno):
#   RELEASE_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   ANDROID_KEYSTORE_BASE64  el debug.keystore de la PC donde se compiló el APK que ya está instalado en el celular
#                            (Windows: %USERPROFILE%\.android\debug.keystore), en base64. SIN este secreto el APK sale con
#                            otra firma y Android se niega a instalarlo encima del anterior.
#                            PowerShell: [Convert]::ToBase64String([IO.File]::ReadAllBytes("$env:USERPROFILE\.android\debug.keystore"))
# Opcional: SITE_REPO_TOKEN si el repo del sitio es privado.
#
# Número de compilación: sin el dato "build", el mayor entre el que va a publicar Windows (el de pubspec.yaml + 1, que
# publicar-beta sube en paralelo) y el último APK publicado en ese canal + 1. Android no deja instalar una versión más vieja
# encima de una más nueva, así que nunca puede quedar por debajo del último APK. Con "build" se usa ese número tal cual.
name: publicar-apk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test/**'
      - '.github/**'
  workflow_dispatch:
    inputs:
      canal:
        description: "beta = solo administradores. stable = a todos"
        required: true
        type: choice
        options: [beta, stable]
        default: stable
      notas:
        description: Qué cambió
        required: true
        default: Actualización de la companion
      build:
        description: "Opcional: número de compilación propio del APK (ej. 2125). Vacío = el de pubspec.yaml. Mayor que el último APK publicado"
        required: false
        default: ""
      rollout:
        description: "Porcentaje de celulares que la reciben (1-100). Conviene 10 y subirlo desde /admin → Versiones; 100 = a todos"
        required: true
        default: "100"
      bot_ref:
        description: "Rama del bot (repo botdemo) que va adentro de Nodo Sur Servicios"
        required: false
        default: main
      edicion:
        description: "Qué app publicar: ambas (almacén y Servicios), una sola, o todas (también Nodo Gastro)"
        required: true
        type: choice
        # Gastronomía (`docs/PLAN-GASTRONOMIA.md`) sale solo a mano, con "gastronomia" o "todas": el push a main no la publica
        # hasta que esté lista.
        options: [ambas, servicios, almacen, gastronomia, todas]
        default: ambas
      solo_compilar:
        description: "Solo compilar los dos APK y dejarlos como artefactos del run, sin publicar (para probar una rama)"
        type: boolean
        default: false

# Una publicación a la vez (el número de compilación sale del último APK publicado). No se cancela la que está corriendo: una
# "beta:" nueva cortaría un "release:" a medias y el estable no saldría nunca. Las que esperan sí se pisan solas (GitHub deja
# en espera solo la última), así que dos betas seguidas no se compilan las dos.
concurrency:
  group: publicar-apk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apk:
    # Un merge común no publica nada (como publicar-beta): solo los "release:" y "beta:".
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'beta:')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SITE_URL: https://broad-frog-1e4b.gtalovergamer.workers.dev
      # Al disparar por merge no hay inputs: canal según el título (release: → stable, beta: → beta), al 100 %, y la primera
      # línea del título como nota.
      CANAL: ${{ inputs.canal || (startsWith(github.event.head_commit.message, 'release:') && 'stable') || 'beta' }}
      ROLLOUT: ${{ inputs.rollout || '100' }}
      BUILD: ${{ inputs.build }}
      MENSAJE: ${{ inputs.notas || github.event.head_commit.message || 'Actualización de la companion' }}
      # Un merge publica las dos; a mano se elige (como publicar-beta).
      EDICION: ${{ inputs.edicion || 'ambas' }}
    steps:
      - name: Comprobar secretos
        run: |
          for v in RELEASE_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANDROID_KEYSTORE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Falta el secreto $v (mirá el encabezado del workflow)"; exit 1; }
          done

      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: neaserisgod/NodoSurPage
          path: sitio
          token: ${{ secrets.SITE_REPO_TOKEN || github.token }}

      # El bot de WhatsApp que va adentro de Nodo Sur Servicios (público).
      - uses: actions/checkout@v4
        with:
          repository: neaserisgod/botdemo
          ref: ${{ inputs.bot_ref || 'main' }}
          path: botdemo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      # Gradle guardado entre corridas (2026-10-13): sin esto el primer APK tardaba ~19 min bajando y compilando todo de cero;
      # el segundo, con lo del primero ya en la máquina, ~2 min. Solo las corridas de main escriben el caché (las de una rama
      # lo leen), y el build cache de Gradle reusa lo compilado de Kotlin/Java que no cambió.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build cache de Gradle
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g wrangler

      - name: Keystore (afuera del repo)
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # La huella de la clave que firma los APK (2026-10-13): Google Cloud la pide para los clientes OAuth tipo Android con que
      # el celular entra con Google sin navegador (`lib/companion/google_en_celular.dart`). Es pública, no un secreto. Sale en
      # el resumen del run; para verla sin publicar, correrlo a mano con "solo_compilar".
      - name: Huella de la clave de firma (SHA-1 y SHA-256)
        run: |
          huellas=$(keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "${ANDROID_KEY_ALIAS:-androiddebugkey}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD:-android}" | grep -E '^\s*SHA(1|256):' | sed -E 's/^\s+//')
          [ -n "$huellas" ] || { echo "::error::No se pudo leer la huella del keystore"; exit 1; }
          echo "$huellas"
          {
            echo "### Huella de la clave de firma"
            echo "Para Google Cloud → Credenciales → ID de cliente OAuth tipo Android (\`com.laplazoleta.companion\` y \`com.laplazoleta.servicios\`, la misma huella para las dos)."
            echo '```'
            echo "$huellas"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: flutter pub get

      - name: Número de compilación
        run: |
          if [ -n "$BUILD" ]; then
            [[ "$BUILD" =~ ^[0-9]+$ ]] || { echo "::error::build tiene que ser un número entero (recibí '$BUILD')"; exit 1; }
            numero="$BUILD"
          else
            pubspec=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*[^+]*\+//')
            # El último APK publicado en CUALQUIER canal (un administrador recibe también las beta), según el registro del sitio.
            ultimo=$(curl -fsS -A "Mozilla/5.0 (publicar-apk)" -H "Authorization: Bearer $RELEASE_TOKEN" -H "X-Release-Token: $RELEASE_TOKEN" "$SITE_URL/api/admin/releases" \
              | node -e 'let t="";process.stdin.on("data",d=>t+=d).on("end",()=>{let m=0;
                  for(const r of JSON.parse(t).releases||[]) if(r.platform==="android"||r.platform==="android-servicios"||r.platform==="android-gastronomia"){const b=+String(r.version).split("+")[1]||0;if(b>m)m=b}
                  console.log(m)})') \
              || { echo "::error::No se pudo leer el último APK publicado del sitio: no se compila con un número que podría ser viejo"; exit 1; }
            numero=$(( pubspec + 1 > ultimo + 1 ? pubspec + 1 : ultimo + 1 ))
            echo "pubspec +1 = $((pubspec + 1)) · último APK publicado = $ultimo → $numero"
          fi
          echo "NUMERO=$numero" >> "$GITHUB_ENV"
          echo "NOTAS=$(printf '%s' "$MENSAJE" | head -n 1)" >> "$GITHUB_ENV"

      # Un solo APK arm64, sin --split-per-abi: con split Flutter suma 2000 al build number y la comparación de versiones se rompe
      # (ver tool/publicar_actualizacion_companion.sh).
      - name: Compilar el APK (almacén)
        if: contains(fromJSON('["ambas","almacen","todas"]'), env.EDICION)
        run: flutter build apk --release --flavor almacen --target-platform android-arm64 --build-number "$NUMERO"

      # Nodo Sur Servicios (`docs/PLAN-APP-SERVICIOS.md`): lleva Node de Termux y el bot de WhatsApp adentro.
      - name: Node y el bot (servicios y gastronomía)
        if: env.EDICION != 'almacen'
        run: |
          sudo apt-get install -y patchelf
          BOT_DIR=botdemo bash tool/preparar_bot_android.sh
      - name: Compilar el APK (servicios)
        if: contains(fromJSON('["ambas","servicios","todas"]'), env.EDICION)
        run: flutter build apk --release --flavor servicios --target-platform android-arm64 --build-number "$NUMERO"
      - name: Compilar el APK (gastronomía)
        if: contains(fromJSON('["gastronomia","todas"]'), env.EDICION)
        run: flutter build apk --release --flavor gastronomia --target-platform android-arm64 --build-number "$NUMERO"

      # Un APK de servicios o gastronomía sin Node no puede correr el bot ("Esta versión de la app no trae el bot"): mejor que
      # falle acá que publicarlo (pasó con Nodo Gastro, 2026-10-21).
      - name: Revisar que el bot vaya adentro
        if: env.EDICION != 'almacen'
        run: |
          for apk in build/app/outputs/flutter-apk/app-servicios-release.apk build/app/outputs/flutter-apk/app-gastronomia-release.apk; do
            [ -f "$apk" ] || continue
            unzip -l "$apk" | grep -q 'lib/arm64-v8a/libns_node.so' || { echo "$apk no trae libns_node.so"; exit 1; }
            unzip -l "$apk" | grep -q 'assets/bot/bot.zip' || { echo "$apk no trae el bot (bot.zip)"; exit 1; }
            echo "$apk trae el bot"
          done

      - name: Guardar los APK (solo compilar)
        if: inputs.solo_compilar
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 7

      - name: Publicar en el sitio
        if: ${{ !inputs.solo_compilar }}
        run: |
          version=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
          # La versión publicada lleva el número que quedó adentro del APK.
          version="${version%%+*}+${NUMERO}"
          # Qué ediciones van, según "edicion" (gastronomía solo con "gastronomia" o "todas").
          va() { case "$EDICION" in todas) return 0 ;; ambas) [ "$1" != gastronomia ] ;; *) [ "$EDICION" = "$1" ] ;; esac; }
          publicar() { # <flavor> <archivo> <plataforma>
            cp "build/app/outputs/flutter-apk/app-$1-release.apk" "$2-${version}.apk"
            node sitio/scripts/publicar-release.mjs --file "$2-${version}.apk" --platform "$3" \
              --channel "$CANAL" --version "$version" --notes "$NOTAS" --rollout "$ROLLOUT"
          }
          if va almacen; then publicar almacen NodoSurPOS-Companion android; fi
          if va servicios; then publicar servicios NodoSurServicios android-servicios; fi
          if va gastronomia; then publicar gastronomia NodoSurGastronomia android-gastronomia; fi
