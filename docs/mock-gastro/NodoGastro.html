<title>Nodo Gastro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&display=swap">
<style>
/* Mock completo de Nodo Gastro (app del celular, edición gastronomía). Versión 5 (El dueño, 18/10: la v4 "me gustó mucho,
   quiero el mock entero así, incluyendo onboarding y todo lo que se deba tener en la app real").
   Cubre lo que la app real tiene hoy (lib/companion/, edición gastronomía): bienvenida, entrar con Google, el asistente
   "Configurá tu negocio" con sus cinco pasos, Pedidos, Carta con recetas e insumos, Vender y los cuatro medios, Caja con
   conteo y cierre en dos etapas, Bot de WhatsApp, Asistente IA, Notificaciones, Configuración, Proveedores, Promos y Cuenta.
   Lenguaje del sitio (NodoSurPage/nodo.css) con patrones móviles de 2026: bento, barra flotante en cápsula, hojas de abajo,
   respuesta al toque, claro y oscuro. Sin backdrop-filter (traba celulares baratos, regla del sitio). */
:root{
  --fondo:#FFFFFF;--sup:#F5F4F2;--sup2:#ECEAE6;--linea:#E6E3DF;
  --txt:#1A1714;--txt2:#57534E;--txt3:#8A847D;
  --acento:#E4580B;--acento-txt:#1A1714;--acento-suave:#FCEBDD;--acento-osc:#9A3A07;
  --inv:#1A1714;--inv-txt:#FFFFFF;--inv-txt2:#B9B3AC;
  --rojo:#C4291C;--rojo-suave:#FCE6E3;--verde:#1F7A4D;--verde-suave:#E2F3EA;
  --barra:#FFFFFF;--sombra:0 18px 40px -14px rgba(26,23,20,.28),0 0 0 1px rgba(26,23,20,.06);
  --pag:#ECEAE6;--pag-txt:#1A1714;--marco:#1A1714;
  --tit:'Bricolage Grotesque',system-ui,sans-serif;--sans:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --resorte:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#0F0E0D;--sup:#1B1917;--sup2:#272421;--linea:#2C2926;
  --txt:#F4F1EC;--txt2:#B8B1A9;--txt3:#8C857D;
  --acento:#F26A1B;--acento-txt:#140A03;--acento-suave:#3A1E0E;--acento-osc:#FFA36B;
  --inv:#F4F1EC;--inv-txt:#1A1714;--inv-txt2:#57534E;
  --rojo:#FF7A6E;--rojo-suave:#3A1714;--verde:#5FD49A;--verde-suave:#12301F;
  --barra:#1F1D1A;--sombra:0 18px 40px -14px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --pag:#161412;--pag-txt:#F4F1EC;--marco:#000;color-scheme:dark}}
:root[data-theme="dark"]{
  --fondo:#0F0E0D;--sup:#1B1917;--sup2:#272421;--linea:#2C2926;
  --txt:#F4F1EC;--txt2:#B8B1A9;--txt3:#8C857D;
  --acento:#F26A1B;--acento-txt:#140A03;--acento-suave:#3A1E0E;--acento-osc:#FFA36B;
  --inv:#F4F1EC;--inv-txt:#1A1714;--inv-txt2:#57534E;
  --rojo:#FF7A6E;--rojo-suave:#3A1714;--verde:#5FD49A;--verde-suave:#12301F;
  --barra:#1F1D1A;--sombra:0 18px 40px -14px rgba(0,0,0,.8),0 0 0 1px rgba(255,255,255,.06);
  --pag:#161412;--pag-txt:#F4F1EC;--marco:#000;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--pag);color:var(--pag-txt);font:400 16px/1.4 var(--sans);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:10px}
.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.toque{transition:transform .35s var(--resorte)}
.toque:active{transform:scale(.95);transition-duration:.1s}

/* página */
.pag{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:72px;align-items:center;max-width:1080px;margin:0 auto;padding-block:32px}
.intro{display:grid;gap:22px;max-width:420px;justify-self:end}
.marca{display:flex;align-items:center;gap:10px;font-family:var(--tit);font-weight:700;font-size:19px;letter-spacing:-.03em}
.marca i{width:28px;height:28px;border-radius:9px;background:var(--acento);display:grid;place-items:center;color:var(--acento-txt)}
.intro h1{font-family:var(--tit);font-size:clamp(40px,4.4vw,56px);font-weight:800;letter-spacing:-.05em;line-height:.95;text-wrap:balance}
.intro h1 span{color:var(--acento)}
.intro .baj{font-size:17px;color:var(--txt2);max-width:36ch}
.recorrido{display:grid;gap:10px;padding:18px;border-radius:24px;background:var(--fondo)}
.recorrido b{font-size:14px;font-weight:600;color:var(--txt2)}
.saltos{display:flex;flex-wrap:wrap;gap:6px}
.saltos button{height:36px;padding:0 14px;border-radius:999px;background:var(--sup);font-size:14px;font-weight:600}
.saltos button.a{background:var(--acento);color:var(--acento-txt)}
.intro .pie-i{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--txt3)}
.tema{height:36px;padding:0 14px;border-radius:999px;background:var(--fondo);font-size:14px;font-weight:600;color:var(--txt);flex:none}

/* celular */
.tel{position:relative;width:390px;height:min(844px,calc(100dvh - 64px));min-height:640px;border-radius:52px;background:var(--fondo);color:var(--txt);
  box-shadow:0 0 0 10px var(--marco),0 60px 100px -40px rgba(26,23,20,.55);overflow:hidden;overflow:clip;display:flex;flex-direction:column}
.est{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-size:15px;font-weight:600}
.est .isla{width:110px;height:31px;border-radius:20px;background:#000}
.vista{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 128px;scrollbar-width:none}
.vista.sola{padding-bottom:20px}
.vista::-webkit-scrollbar{display:none}
.vista.entra{animation:empuja .4s var(--ease)}
@keyframes empuja{from{opacity:0;transform:translateX(24px)}}

/* encabezados */
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 4px 16px}
.cab small{display:block;font-size:14px;font-weight:500;color:var(--txt3);margin-bottom:4px}
.cab h2{font-family:var(--tit);font-size:40px;font-weight:800;letter-spacing:-.055em;line-height:.95;text-wrap:balance}
.cab.sub h2{font-size:32px}
.cab .der{display:flex;gap:8px;flex:none}
.volver{height:40px;padding:0 16px;border-radius:999px;background:var(--sup);font-size:15px;font-weight:600;flex:none;margin-bottom:2px}
.redondo{width:48px;height:48px;border-radius:50%;background:var(--sup);display:grid;place-items:center;color:var(--txt);position:relative}
.redondo svg{width:22px;height:22px}
.redondo.a{background:var(--acento);color:var(--acento-txt)}
.redondo.pau{background:var(--rojo);color:#fff}
.redondo .pt{width:10px;height:10px;border-radius:50%;background:var(--verde)}
.redondo.dem .pt{background:var(--acento)}
.redondo .badge{position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:var(--acento);box-shadow:0 0 0 2px var(--fondo)}

/* bento */
.bento{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.bento.dos{grid-template-columns:1fr 1fr}
.mos{border-radius:28px;padding:16px;text-align:left;display:grid;align-content:space-between;gap:10px;min-height:104px;background:var(--sup);color:var(--txt)}
.mos small{font-size:14px;font-weight:600;color:var(--txt2)}
.mos b{font-family:var(--tit);font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:.9}
.mos .sub{font-size:14px;color:var(--txt2);line-height:1.25}
.mos.nar{background:var(--acento);color:var(--acento-txt)}
.mos.nar small,.mos.nar .sub{color:var(--acento-txt);opacity:.8}
.mos.inv{background:var(--inv);color:var(--inv-txt)}
.mos.inv small,.mos.inv .sub{color:var(--inv-txt2)}
.mos.alto{grid-row:span 2;min-height:216px}
.mos.ancho{grid-column:span 2;min-height:0}
.mos.inv b.xl{font-size:64px}
.mos b .u{font-size:26px;letter-spacing:-.03em}
.mos .quien{display:block;font-weight:600;font-size:17px}
.mos.chico{min-height:0;padding:14px 16px;gap:4px}
.mos.chico b{font-size:20px;letter-spacing:-.03em;font-family:var(--sans);font-weight:600}
.vivo{display:inline-flex;align-items:center;gap:7px}
.vivo::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acento);animation:latido 1.6s ease-in-out infinite}
.vivo.ok::before{background:var(--verde)}
.tarde .vivo::before{background:var(--rojo)}
.tarde b{color:var(--rojo)}
@keyframes latido{50%{opacity:.25}}
.barrita{height:6px;border-radius:3px;background:rgba(127,127,127,.28);overflow:hidden}
.barrita i{display:block;height:100%;border-radius:3px;background:var(--acento)}

/* filtros y segmentados */
.filtros{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:18px -16px 4px;padding:0 16px}
.filtros::-webkit-scrollbar{display:none}
.filtros button{flex:none;height:40px;padding:0 15px;border-radius:999px;background:var(--sup);font-size:15px;font-weight:600;color:var(--txt2);display:flex;gap:7px;align-items:center}
.filtros button .c{font-size:13px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--fondo);display:grid;place-items:center;color:var(--txt)}
.filtros button[aria-pressed=true]{background:var(--txt);color:var(--fondo)}
.filtros button[aria-pressed=true] .c{background:var(--acento);color:var(--acento-txt)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:999px;background:var(--sup)}
.seg button{height:44px;border-radius:999px;font-size:15px;font-weight:600;color:var(--txt2);text-align:center;transition:background-color .25s,color .25s;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--txt);color:var(--fondo)}
.seg button.pau[aria-pressed=true]{background:var(--rojo);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:40px;padding:0 15px;border-radius:999px;background:var(--sup);font-size:15px;font-weight:600;color:var(--txt2)}
.chips button[aria-pressed=true]{background:var(--txt);color:var(--fondo)}

.aviso{margin-top:12px;padding:14px 16px;border-radius:20px;background:var(--rojo-suave);color:var(--rojo);font-size:15px;font-weight:600}
.pendiente{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:14px 16px;border-radius:22px;background:var(--acento-suave);width:100%;text-align:left}
.pendiente span{flex:1;font-size:15px}
.pendiente span b{display:block;font-weight:600}
.pendiente em{font-style:normal;height:34px;padding:0 14px;border-radius:999px;background:var(--acento);color:var(--acento-txt);font-weight:600;font-size:14px;display:grid;place-items:center}

/* pedido */
.peds{display:grid;gap:8px;margin-top:12px}
.ped{border-radius:28px;background:var(--sup);padding:18px;display:grid;gap:12px;animation:entra .45s var(--resorte) both}
@keyframes entra{from{opacity:0;transform:translateY(12px) scale(.98)}}
.ped.sale{animation:sale .3s var(--ease) forwards}
@keyframes sale{to{opacity:0;transform:translateX(40px) scale(.96)}}
.ped-a{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ped-a .q b{display:block;font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.ped-a .q small{display:block;font-size:14px;color:var(--txt2);margin-top:3px}
em.ok{font-style:normal;font-weight:600;color:var(--verde)}
.reloj{text-align:right;flex:none}
.reloj b{display:block;font-family:var(--tit);font-size:26px;font-weight:700;letter-spacing:-.04em;line-height:1}
.reloj small{display:inline-block;margin-top:5px;font-size:13px;font-weight:600;color:var(--txt2)}
.reloj small.tarde{color:var(--rojo)}
.reloj small.nuevo{color:var(--acento-osc)}
.items{display:grid;gap:4px;padding:12px 14px;border-radius:18px;background:var(--fondo)}
.items li{display:grid;grid-template-columns:30px 1fr;font-size:16px;align-items:baseline}
.items li b{font-family:var(--tit);font-weight:700;font-size:18px}
.nota-c{font-size:14px;font-weight:600;color:var(--acento-osc)}
.ped-p{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ped-p .tot{font-family:var(--tit);font-size:21px;font-weight:700;letter-spacing:-.03em;padding:6px 0}
.accs{display:flex;gap:6px}

.b{height:48px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.b svg{width:20px;height:20px;flex:none}
.b-a{background:var(--acento);color:var(--acento-txt)}
.b-c{background:var(--txt);color:var(--fondo)}
.b-s{background:var(--sup);color:var(--txt)}
.b-t{color:var(--txt2);padding:0 12px}
.b-r{color:var(--rojo)}
.b-g{width:100%;height:56px;font-size:17px}
.b:disabled{opacity:.45;cursor:default}

.vacio{padding:44px 8px;text-align:center;color:var(--txt2);font-size:15px}
.vacio b{display:block;font-family:var(--tit);font-size:26px;letter-spacing:-.04em;color:var(--txt);margin-bottom:6px}

/* listas en grupos */
.grupo{margin-top:22px}
.grupo>h3{font-size:14px;font-weight:600;color:var(--txt3);margin:0 6px 8px;display:flex;justify-content:space-between}
.lista{border-radius:24px;background:var(--sup);overflow:hidden}
.fila{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;text-align:left}
.fila+.fila{border-top:1px solid var(--linea)}
.fila .q{flex:1;min-width:0}
.fila .q b{display:block;font-weight:600;font-size:16px}
.fila .q small{display:block;font-size:14px;color:var(--txt2);margin-top:1px}
.fila .d{text-align:right;flex:none}
.fila .d b{display:block;font-weight:600}
.fila .d small{display:block;font-size:13px;font-weight:600;color:var(--txt2)}
.fila .d small.ok{color:var(--verde)}
.fila .d small.bajo{color:var(--rojo)}
.fila .fl{color:var(--txt3);font-size:22px;line-height:1}
.ico-f{flex:none;width:42px;height:42px;border-radius:14px;background:var(--fondo);display:grid;place-items:center;color:var(--txt);font-family:var(--tit);font-weight:800;font-size:17px}
.ico-f svg{width:21px;height:21px}
.ico-f.nar{background:var(--acento);color:var(--acento-txt)}
.ico-f.verde{background:var(--verde-suave);color:var(--verde)}
.ico-f.rojo{background:var(--rojo-suave);color:var(--rojo)}
.sw{flex:none;width:52px;height:32px;border-radius:999px;background:var(--sup2);position:relative;transition:background-color .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--resorte)}
.sw[aria-checked=true]{background:var(--acento)}
.sw[aria-checked=true]::after{transform:translateX(20px)}
.buscar{display:flex;align-items:center;gap:10px;height:54px;padding:0 18px;border-radius:999px;background:var(--sup)}
.buscar svg{width:22px;height:22px;color:var(--txt3);flex:none}
.buscar input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:17px}
.buscar input::placeholder{color:var(--txt3)}

/* carta y vender */
.traer{display:flex;gap:12px;align-items:center;margin-top:10px;padding:16px;border-radius:24px;background:var(--acento-suave);width:100%;text-align:left}
.traer span{flex:1;font-size:15px}
.traer span b{display:block;font-weight:600}
.traer em{font-style:normal;height:36px;padding:0 14px;border-radius:999px;background:var(--acento);color:var(--acento-txt);font-weight:600;font-size:14px;display:grid;place-items:center}
.rapidos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.rapido{border-radius:24px;background:var(--sup);padding:14px 16px;text-align:left;display:grid;gap:10px;min-height:92px;align-content:space-between}
.rapido b{font-size:15px;font-weight:600;line-height:1.2}
.rapido span{font-family:var(--tit);font-size:19px;font-weight:700;letter-spacing:-.03em}
.paso{display:flex;align-items:center;gap:4px;background:var(--fondo);border-radius:999px;padding:3px;flex:none}
.paso button{width:34px;height:34px;border-radius:50%;background:var(--sup);font-size:18px;font-weight:600;line-height:1;text-align:center}
.paso span{min-width:24px;text-align:center;font-weight:700}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:20px 6px 12px}
.total span{font-size:15px;color:var(--txt2);font-weight:500}
.total b{font-family:var(--tit);font-size:46px;font-weight:800;letter-spacing:-.055em}
.medios{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.medio{height:62px;border-radius:22px;background:var(--sup);font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px}
.medio svg{width:22px;height:22px}
.medio.a,.medio[aria-pressed=true]{background:var(--acento);color:var(--acento-txt)}
.medio:disabled{opacity:.4;cursor:default}
.link{font-size:15px;font-weight:600;color:var(--txt2);text-decoration:underline;text-underline-offset:3px;padding:8px 6px}

/* caja */
.barras{display:grid;gap:12px;padding:16px;border-radius:24px;background:var(--sup)}
.barras li{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:15px}
.barras li b{font-weight:600}
.barras .bar{height:8px;border-radius:4px;background:var(--fondo);overflow:hidden}
.barras .bar i{display:block;height:100%;border-radius:4px;background:var(--txt)}
.barras .bar i.a{background:var(--acento)}
.acciones4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acc4{border-radius:24px;background:var(--sup);padding:14px 16px;text-align:left;display:grid;gap:14px;min-height:96px;align-content:space-between}
.acc4 svg{width:24px;height:24px}
.acc4 b{font-weight:600;font-size:15px;line-height:1.2}
.acc4 small{display:block;font-size:13px;color:var(--txt2);font-weight:500;margin-top:2px}

/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;gap:16px;padding-top:6px}
.ob-pie{margin-top:auto;display:grid;gap:6px;padding-top:12px}
.ob-prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--txt3)}
.ob-prog .barrita{flex:1}
.ob h2{font-family:var(--tit);font-size:40px;font-weight:800;letter-spacing:-.055em;line-height:.95;text-wrap:balance}
.ob h2 span{color:var(--acento)}
.ob .baj{font-size:17px;color:var(--txt2)}
.ob-escena{border-radius:32px;background:var(--sup);padding:18px;display:grid;gap:10px;min-height:300px;align-content:center;overflow:hidden}
.puntos{display:flex;gap:6px;justify-content:center;padding:4px 0}
.puntos i{width:8px;height:8px;border-radius:4px;background:var(--sup2);transition:width .3s var(--ease),background-color .3s}
.puntos i.on{width:24px;background:var(--txt)}
.burb{max-width:82%;padding:10px 14px;border-radius:20px;font-size:15px;line-height:1.3;animation:entra .5s var(--resorte) both}
.burb.cli{justify-self:end;background:var(--acento);color:var(--acento-txt);border-bottom-right-radius:6px}
.burb.bot{background:var(--fondo);border-bottom-left-radius:6px}
.burb small{display:block;font-size:12px;opacity:.7;margin-top:2px}
.g{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--fondo);color:var(--txt);font-weight:700;font-size:15px}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;font-size:16px}
.chk+.chk{border-top:1px solid var(--linea)}
.chk i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--verde-suave);color:var(--verde);font-style:normal;font-weight:700}
.chk i.no{background:var(--sup2);color:var(--txt3)}
.chk span{flex:1}
.chk small{display:block;font-size:13px;color:var(--txt2)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dias button{height:44px;border-radius:14px;background:var(--sup);font-weight:600;font-size:14px;text-align:center;color:var(--txt2)}
.dias button[aria-pressed=true]{background:var(--txt);color:var(--fondo)}
.dos-c{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* chat de la IA y registro del bot */
.chat{display:grid;gap:8px;padding-bottom:8px}
.chat .burb.yo{justify-self:end;background:var(--txt);color:var(--fondo);border-bottom-right-radius:6px}
.chat .burb.ia{background:var(--sup);border-bottom-left-radius:6px;max-width:90%}
.chat .accion{background:var(--fondo);border-radius:16px;padding:12px;margin-top:8px;display:grid;gap:8px}
.registro{font-size:14px;color:var(--txt2);display:grid;gap:8px;padding:14px 16px;border-radius:24px;background:var(--sup)}
.registro li{display:grid;grid-template-columns:46px 1fr;gap:8px}
.registro li b{font-weight:600;color:var(--txt3)}
.qr{width:188px;height:188px;margin:6px auto;padding:12px;border-radius:24px;background:#fff}
.qr svg{width:100%;height:100%}
.espera{display:grid;place-items:center;gap:10px;padding:18px 0;text-align:center;color:var(--txt2)}
.rueda{width:40px;height:40px;border-radius:50%;border:4px solid var(--sup2);border-top-color:var(--acento);animation:gira .9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.hecho{width:72px;height:72px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;margin:4px auto 10px;animation:entra .5s var(--resorte) both}
.hecho svg{width:36px;height:36px}

/* barra de pestañas flotante */
.barra{position:absolute;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:66px;border-radius:999px;background:var(--barra);box-shadow:var(--sombra);display:grid;grid-template-columns:repeat(5,1fr);padding:6px;z-index:5}
.barra button{border-radius:999px;display:grid;place-items:center;gap:1px;font-size:11px;font-weight:600;color:var(--txt3);text-align:center;transition:background-color .25s,color .25s}
.barra button svg{width:22px;height:22px}
.barra button[aria-current=page]{background:var(--sup);color:var(--txt)}
.barra .ico{position:relative}
.barra .badge{position:absolute;top:-4px;right:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--acento);color:var(--acento-txt);font-size:11px;font-weight:700;display:grid;place-items:center}

/* hoja */
.velo{position:absolute;inset:0;background:rgba(10,9,8,.42);z-index:10;opacity:0;pointer-events:none;transition:opacity .25s}
.velo.on{opacity:1;pointer-events:auto}
.hoja{position:absolute;left:8px;right:8px;bottom:8px;max-height:90%;overflow-y:auto;background:var(--fondo);border-radius:36px;padding:10px 20px 22px;z-index:11;transform:translateY(110%);visibility:hidden;transition:transform .4s var(--ease),visibility 0s .4s;scrollbar-width:none;box-shadow:var(--sombra)}
.hoja.on{transform:none;visibility:visible;transition:transform .45s var(--resorte)}
.hoja::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--sup2);margin:0 auto 14px}
.hoja h3{font-family:var(--tit);font-size:28px;font-weight:800;letter-spacing:-.045em;line-height:1;margin-bottom:8px}
.hoja .sub{font-size:15px;color:var(--txt2)}
.hoja .botones{display:grid;gap:8px;margin-top:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;font-size:16px}
.kv+.kv{border-top:1px solid var(--linea)}
.kv.t{font-weight:700;font-size:18px}
.kv .rojo{color:var(--rojo);font-weight:600}
.kv .ok{color:var(--verde);font-weight:600}
.hsec{margin:20px 6px 8px;font-size:14px;font-weight:600;color:var(--txt3)}
.campo{display:grid;gap:6px;margin-top:12px}
.campo label{font-size:14px;font-weight:500;color:var(--txt2);margin-left:6px}
.campo input{height:54px;border-radius:18px;border:0;background:var(--sup);padding:0 18px;font-size:17px;outline:none;width:100%}
.campo input:focus{box-shadow:0 0 0 2px var(--txt)}
.ayuda{font-size:14px;color:var(--txt2);margin:10px 6px 0}
.info{font-size:14px;color:var(--txt2);padding:12px 14px;border-radius:16px;background:var(--sup);margin-top:10px}

/* aviso arriba (mostrarAviso), en cápsula */
.toast{position:absolute;left:50%;top:10px;z-index:20;max-width:calc(100% - 24px);width:max-content;padding:12px 18px;border-radius:22px;background:#000;color:#fff;font-size:15px;font-weight:500;text-align:center;
  transform:translate(-50%,-140%) scale(.9);opacity:0;transition:transform .45s var(--resorte),opacity .25s;display:flex;gap:12px;align-items:center}
.toast.on{transform:translate(-50%,0) scale(1);opacity:1}
.toast button{color:var(--acento);font-weight:600}

const qrSvg = () => { let r = '', x = 7; const on = (i, j) => { x = (x * 9301 + 49297) % 233280; return x / 233280 > .5; };

// =================== Pedidos ===================
function acciones(p) {
  const cobrable = !p.pagado && !p.cobrado;
  if (p.estado === 'porConfirmar') return [['Rechazar','rechazado','b-t'], ['Aceptar','porHacer','b-a']];
  if (p.estado === 'porHacer') return [['Listo','listo','b-c']];
  if (p.estado === 'listo' && esEnvio(p)) return [['Salió','enCamino','b-c']];
  if (p.estado === 'listo' || p.estado === 'enCamino') return [cobrable ? ['Cobrar','cobrar','b-c'] : ['Entregado','entregado','b-c']];
  return [];
}
function tarjeta(p) {
  const d = faltan(p);
  const sub = p.estado === 'porConfirmar' ? '<small class="nuevo">Nuevo</small>' : p.estado === 'enCamino' ? '<small>En la calle</small>'
    : p.estado === 'esperandoPago' ? '<small>Sin pagar</small>' : d < 0 ? `<small class="tarde">${-d} min tarde</small>` : `<small>en ${d} min</small>`;
  const meta = `${p.canal} · ${esEnvio(p) ? 'Envío a ' + p.zona : 'Retira'}${p.pagado ? ' · <em class="ok">Pagado</em>' : p.cobrado ? ' · <em class="ok">Cobrado</em>' : ''}`;
  return `<article class="ped" aria-label="Pedido ${p.num} de ${esc(p.cli)}">
    <div class="ped-a"><div class="q"><b>${esc(p.cli)}</b><small>${meta}</small></div><div class="reloj"><b class="n">${p.hora}</b>${sub}</div></div>
    <ul class="items">${p.lin.map(([id, q]) => `<li><b class="n">${q}</b><span>${esc(plato(id).n)}</span></li>`).join('')}</ul>
    ${p.nota ? `<p class="nota-c">${esc(p.nota)}</p>` : ''}
    ${p.estado === 'esperandoPago' ? '<p class="ayuda" style="margin:0">Tiene el link de Mercado Pago. Se cocina cuando pague.</p>' : ''}
    <div class="ped-p"><button class="tot n" data-do="detalle" data-id="${p.id}" aria-label="Ver el detalle">${plata(totalPedido(p))}</button>
      <div class="accs">${acciones(p).map(([t, a, c]) => `<button class="b ${c} toque" data-do="avanzar" data-a="${a}" data-id="${p.id}">${t}</button>`).join('')}</div></div>
  </article>`;
}
function mosaicoAhora() {

  const p = PEDIDOS.filter(x => x.estado === 'porHacer').sort((a, b) => aMin(a.hora) - aMin(b.hora))[0];
  if (!p) return `<button class="mos inv alto toque" data-do="filtro" data-v="porHacer"><small class="vivo ok">Cocina al día</small><b class="xl n">0</b><span class="sub">No hay nada por hacer.</span></button>`;
  const d = faltan(p), tarde = d < 0;
  return `<button class="mos inv alto toque${tarde ? ' tarde' : ''}" data-do="detalle" data-id="${p.id}">
    <small class="vivo">${tarde ? 'Atrasado' : 'Sale ahora'}</small>
    <span><b class="xl n">${Math.abs(d)}<span class="u"> min</span></b><span class="sub" style="display:block;margin-top:4px">${tarde ? 'de atraso' : 'para las ' + p.hora}</span></span>
    <span><span class="quien">${esc(p.cli)} · #${p.num}</span><span class="sub">${p.lin.map(([id, q]) => q + ' ' + esc(plato(id).n)).join(' · ')}</span></span>
    <span class="barrita"><i style="width:${Math.max(6, Math.min(100, 100 - d / 30 * 100))}%"></i></span></button>`;
}

function avanzar(p, a, boton) {
  if (a === 'cobrar') return empezarCobro(p);
  const card = boton && boton.closest('.ped');
  const hacer = () => {
    p.estado = a; render();
    if (p.canal !== 'WhatsApp' && p.tel && (a === 'listo' || a === 'enCamino')) return abrirHoja('avisar', [p.id, a]);
    aviso({ porHacer:`#${p.num} a la cocina${p.canal === 'WhatsApp' ? ', el bot le avisó' : ''}`, rechazado:`#${p.num} rechazado, el bot le avisó`, listo:`#${p.num} listo`, enCamino:`#${p.num} salió`, entregado:`#${p.num} entregado` }[a]);
  };
  if (card && !matchMedia('(prefers-reduced-motion: reduce)').matches) { card.classList.add('sale'); setTimeout(hacer, 260); } else hacer();
}
function empezarCobro(p) {
  if (!S.caja.abierta) { aviso('El día no empezó: abrí la caja para cobrar'); return abrirHoja('abrirCaja'); }
  S.cobro = { ped:p || null, total:p ? totalPedido(p) : totalCarrito(), medio:S.cobro.medioIni || 'Efectivo', paga:'justo', ef:'', qrDonde:'pantalla', fase:'elegir' };
  abrirHoja('cobro');
}
function registrarCobro() {
  const c = S.cobro, canal = c.ped ? c.ped.canal : 'Mostrador';
  S.caja.medios[c.medio] += c.total; S.caja.canales[canal] += c.total;
  S.caja.ventas++; VENTAS.unshift({ num:(VENTAS[0]?.num || 0) + 1, h:'21:02', items:c.ped ? c.ped.lin.map(([i, q]) => q + ' ' + plato(i).n).join(' · ') : S.carrito.map(([i, q]) => q + ' ' + plato(i).n).join(' · '), total:c.total, medio:c.medio, canal });
  if (c.ped) { c.ped.cobrado = true; if (c.ped.estado === 'listo' || c.ped.estado === 'enCamino') c.ped.estado = 'entregado'; }
  else { S.carrito = []; S.descuento = 0; }
  c.vuelto = c.medio === 'Efectivo' && c.paga !== 'justo' ? Math.max(0, pesos(c.paga) - c.total) : 0;
  c.fase = 'hecho'; refrescarHoja(); render();
  // "Venta cobrada" se cierra sola (rediseño v4 de la PC): no hay que tocar nada para seguir.
  clearTimeout(esperaTimer); esperaTimer = setTimeout(() => { if (hojaActual && hojaActual[0] === 'cobro') cerrarHoja(); }, 4000);
}
function iaResponder(q) {
  S.chat.push({ yo:true, t:q });
  const l = q.toLowerCase(); let r;
  if (l.includes('gasto')) { const m = (q.match(/\d+/) || ['8000'])[0];
    r = `Anoto un gasto de ${plata(+m * 100)} de gas, de efectivo.<div class="accion"><b>¿Lo hago?</b><button class="b b-a" style="height:40px" data-do="iaHacer" data-v="${m}">Sí, hacerlo</button></div>`; }
  else if (l.includes('plato')) r = 'La que más te deja es la <b>pizza muzzarella</b>: 52 % por pizza, y salieron 11 hoy. La que menos, la <b>tarta de verdura</b> (21 %): la acelga subió 40 % este mes. Te conviene subirla a $ 11.000.';
  else r = `Vas muy bien: este mes llevás <b>${plata(612000000)}</b>, un 18 % más que septiembre a esta altura. El bot trajo el 58 %. El sábado es tu mejor día.`;
  S.chat.push({ t:r }); render();
  const v = $('vista'); v.scrollTop = v.scrollHeight;
}

  sumar:el => { const l = S.carrito.find(([i]) => i === el.dataset.id); l ? l[1]++ : S.carrito.push([el.dataset.id, 1]); render(); },
  cq:el => { const l = S.carrito.find(([i]) => i === el.dataset.id); l[1] += +el.dataset.d; S.carrito = S.carrito.filter(([, q]) => q > 0); if (!S.carrito.length) S.descuento = 0; render(); },
  vaciar:() => { const antes = S.carrito; S.carrito = []; S.descuento = 0; render(); aviso('Venta vaciada', () => { S.carrito = antes; render(); }); },
  sinDesc:() => { S.descuento = 0; render(); },
  descPct:el => { S.descTxt = String(Math.round(S.carrito.reduce((s, [i, q]) => s + plato(i).p * q, 0) * el.dataset.v / 100 / 100)); refrescarHoja(); },
  descOk:() => { const sub = S.carrito.reduce((s, [i, q]) => s + plato(i).p * q, 0); S.descuento = Math.min(sub, pesos(S.descTxt)); cerrarHoja(); render(); aviso('Descuento aplicado'); },
  cobrar:el => { S.cobro.medioIni = el.dataset.m; const p = el.dataset.ped ? PEDIDOS.find(x => x.id === +el.dataset.ped) : null; empezarCobro(p); S.cobro.medioIni = null; },
  cobroOk:() => { const c = S.cobro;
    if (c.medio === 'Efectivo' && c.paga !== 'justo' && pesos(c.paga) < c.total) return aviso('Con eso no alcanza');
    if (c.medio === 'QR' || c.medio === 'Point') { c.fase = 'espera'; refrescarHoja(); clearTimeout(esperaTimer); esperaTimer = setTimeout(() => { if (hojaActual && S.cobro.fase === 'espera') registrarCobro(); }, 2400); return; }
    registrarCobro(); },
  cobroMano:() => registrarCobro(),
  // carta
  plato:el => { const p = plato(el.dataset.id); S.ed = { n:p.n, min:String(p.min || ''), precio:String(p.p / 100), rec:(p.rec || []).map(r => [...r]), oculto:!!p.oculto }; abrirHoja('plato', p.id); },
  recSumar:el => { S.ed.rec.push([el.dataset.id, INSUMOS[el.dataset.id].u === 'u' ? 1 : 0.2]); refrescarHoja(); },
  recSacar:el => { S.ed.rec.splice(+el.dataset.id, 1); refrescarHoja(); },
  platoOk:el => { const e = S.ed; if (!e.n.trim() || !pesos(e.precio)) return aviso('Completá nombre, tiempo de preparación y precio');
    const p = el.dataset.id ? plato(el.dataset.id) : null;
    if (p) Object.assign(p, { n:e.n.trim(), min:+e.min || p.min, p:pesos(e.precio), rec:p.rec ? e.rec : p.rec, oculto:e.oculto });
    else CARTA.unshift({ id:'p' + Date.now(), n:e.n.trim(), cat:'Platos', p:pesos(e.precio), min:+e.min || 15, rec:e.rec, oculto:e.oculto });
    cerrarHoja(); render(); aviso(p ? 'Plato guardado' : 'Plato creado · ya está en la carta del bot'); },
  platoBaja:el => { const i = CARTA.findIndex(p => p.id === el.dataset.id), p = CARTA.splice(i, 1)[0]; cerrarHoja(); render(); aviso(`${p.n}: ya no se ofrece`, () => { CARTA.splice(i, 0, p); render(); }); },
  insumo:el => { S.insQ = ''; S.insP = String(INSUMOS[el.dataset.id].c / 100); abrirHoja('insumo', el.dataset.id); },
  insumoOk:el => { const i = INSUMOS[el.dataset.id], q = parseFloat(String(S.insQ).replace(',', '.'));
    if (!(q >= 0) || S.insQ === '') return aviso('Escribí cuánto'); if (S.insModo === 'compra') { i.hay = Math.round((i.hay + q) * 100) / 100; i.c = pesos(S.insP) || i.c; aviso('Compra sumada al stock'); } else { i.hay = q; aviso('Conteo guardado'); }
    cerrarHoja(); render(); },
  insumoNuevoOk:() => { if (!S.ni.n.trim()) return aviso('Escribí el nombre'); INSUMOS['i' + Date.now()] = { n:S.ni.n.trim(), u:S.ni.u || 'u', hay:0, c:pesos(S.ni.c) }; cerrarHoja(); render(); aviso('Insumo cargado. Sumá lo que tenés con "Cargar compra"'); },
  preciosOk:() => { const antes = CARTA.map(p => p.p); CARTA.forEach(p => { p.p = subido(p.p); }); cerrarHoja(); render(); aviso(`Cambiaron ${CARTA.length} precios`, () => { CARTA.forEach((p, i) => { p.p = antes[i]; }); render(); }); },
  traerOk:() => { S.traer.filter(t => t.on).forEach(t => CARTA.push({ id:'w' + Math.random(), n:t.n, cat:'Platos', p:t.p, min:10, rec:[] })); const n = S.traer.filter(t => t.on).length; S.traer = S.traer.filter(t => !t.on); cerrarHoja(); render(); aviso(`Se trajeron ${n} a la carta`); },
  // caja
  abrirCajaOk:() => { Object.assign(S.caja, { abierta:true, cerrado:false, desde:'21:02', fondo:pesos(S.fondoTxt), medios:{Efectivo:0, QR:0, Point:0, Mixto:0}, canales:{WhatsApp:0, Mostrador:0, Teléfono:0}, movs:[], ventas:0 }); VENTAS.length = 0; cerrarHoja(); render(); aviso('Caja abierta. A vender'); },
  gastoOk:() => { const m = pesos(S.mov.monto); if (!m) return aviso('Escribí el monto'); S.caja.movs.unshift({ t:S.mov.t, m:S.mov.m, monto:m, de:S.mov.de, h:'21:02' }); S.mov.monto = ''; cerrarHoja(); S.cajaVista = 'Movimientos'; render(); aviso(`${S.mov.t} anotado`); },
  pagarA:el => { S.pp = { i:+el.dataset.id, monto:String(PROVEEDORES[+el.dataset.id].deuda / 100), de:'Efectivo' }; abrirHoja('pagarProv'); },
  pagarProvOk:() => { const p = PROVEEDORES[S.pp.i], m = Math.min(pesos(S.pp.monto), p.deuda || pesos(S.pp.monto)); if (!m) return aviso('Escribí el monto'); p.deuda = Math.max(0, p.deuda - m);
    S.caja.movs.unshift({ t:'Gasto', m:'Pago a ' + p.n, monto:m, de:S.pp.de, h:'21:02' }); cerrarHoja(); render(); aviso(`Pagado ${plata(m)} a ${p.n}`); },
  venta:el => abrirHoja('venta', el.dataset.id),
  anular:el => { const v = VENTAS[+el.dataset.id]; v.anulada = true; S.caja.medios[v.medio] -= v.total; S.caja.canales[v.canal] -= v.total; cerrarHoja(); render(); aviso('Venta anulada'); },
  proveedor:el => abrirHoja('proveedor', el.dataset.id),
  traerMp:() => { S.cierre.mpTxt = String(mpEsperado() / 100); AFTER.cierreDif(); const i = $('ci-mp'); if (i) i.value = S.cierre.mpTxt; aviso('Saldo traído de Mercado Pago'); },
  cierreEtapa:() => { if (S.cierre.efTxt === '' || S.cierre.mpTxt === '') return aviso('Contá el efectivo y anotalo antes de confirmar'); S.cierre.etapa = 2; render(true); },
  cierreCerrar:() => { S.cierre.etapa = 3; S.caja.abierta = false; S.caja.cerrado = true; render(true); },
  cierreFin:() => { S.cierre = { etapa:1, efTxt:'', mpTxt:'', ef:0, mp:0, motivo:'', nota:'' }; irTab('caja'); },
  // más
  notifInsumos:() => { S.cartaCat = 'Insumos'; irTab('carta'); },
  iaPreguntar:el => iaResponder(el.dataset.t),
  iaEnviar:() => { const i = $('ia-q'); if (i && i.value.trim()) iaResponder(i.value.trim()); },
  iaHacer:el => { S.caja.movs.unshift({ t:'Gasto', m:'Gas', monto:+el.dataset.v * 100, de:'Efectivo', h:'21:02' }); S.chat.push({ t:'Listo, anotado. Lo ves en Caja › Movimientos.' }); render(); aviso('Gasto anotado'); },
  crearCombo:() => { PROMOS.push({ n:'Pizza + Coca 1,5 L', d:'Combo a $ 14.900', on:true }); S.promos.push(true); render(); aviso('Combo creado · el bot ya lo ofrece'); },
  sacarZona:el => { const z = S.cfg.zonas.splice(+el.dataset.id, 1)[0]; render(); aviso(`Zona ${z.nombre} sacada`, () => { S.cfg.zonas.splice(+el.dataset.id, 0, z); render(); }); },
  zonaOk:() => { if (!S.nz.nombre.trim() || !pesos(S.nz.costo)) return aviso('Poné una zona y lo que cobrás el envío'); S.cfg.zonas.push({ nombre:S.nz.nombre.trim(), costo:pesos(S.nz.costo), demora:+S.nz.demora || 0 }); cerrarHoja(); render(); aviso('Zona agregada'); },
  hDia:el => { const d = S.cfg.horario.dias, i = +el.dataset.i; d[i] = d[i] ? 0 : 1; render(); },
  vhOk:() => { S.cfg.valorHora = pesos(S.vhTxt) || S.cfg.valorHora; cerrarHoja(); render(); aviso('Mano de obra guardada · los costos se actualizaron'); },
  usuarioOk:el => { S.usuario = el.dataset.id; cerrarHoja(); render(); aviso(`Ahora está ${S.usuario}`); },
  guardar:el => { if (hojaActual) cerrarHoja(); render(); aviso(el.dataset.t || 'Guardado'); },
  deshacer:() => { if (avisoDeshacer) { avisoDeshacer(); avisoDeshacer = null; } $('toast').classList.remove('on'); },
};
function siguientePaso() { const o = S.ob; if (o.paso < PASOS.length - 1) { o.paso++; render(true); } else { o.pantalla = 'listo'; render(true); } }

// =================== render ===================
function barra() {
  const n = cuenta('porConfirmar');
  $('barra').innerHTML = [['pedidos','Pedidos'],['carta','Carta'],['vender','Vender'],['caja','Caja'],['mas','Más']].map(([k, t]) =>
    `<button data-do="tab" data-id="${k}" ${S.tab === k ? 'aria-current="page"' : ''}><span class="ico">${svg(k)}${k === 'pedidos' && n ? `<span class="badge n">${n}</span>` : ''}</span>${t}</button>`).join('');
}
function render(anim) {
  const v = $('vista'), ob = S.ob.activo, sub = !ob && S.pila.length;
  $('barra').hidden = ob || sub; v.classList.toggle('sola', ob || !!sub);
  if (!ob && !sub) barra();
  const st = v.scrollTop;
  v.innerHTML = ob ? vistaOnboarding() : sub ? PAGINAS[S.pila[S.pila.length - 1][0]](S.pila[S.pila.length - 1][1]) : { pedidos:vistaPedidos, carta:vistaCarta, vender:vistaVender, caja:vistaCaja, mas:vistaMas }[S.tab]();
  if (anim) { v.classList.remove('entra'); void v.offsetWidth; v.classList.add('entra'); v.scrollTop = 0; } else v.scrollTop = st;
  document.querySelectorAll('#saltos button').forEach(b => b.classList.toggle('a', b.dataset.salto === (ob ? 'ob' : sub ? S.pila[S.pila.length - 1][0] : S.tab)));
}

// =================== eventos ===================
$('tel').addEventListener('click', e => {
  const c = e.target.closest('[data-cerrar]'); if (c) { cerrarHoja(); if (c.dataset.cerrar) aviso(c.dataset.cerrar); return; }
  const g = e.target.closest('[data-go]'); if (g) return ir(g.dataset.go);
  const d = e.target.closest('[data-do]'); if (d && DO[d.dataset.do]) { if (d.disabled) return; DO[d.dataset.do](d, e); }
});
$('tel').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) { set(t.dataset.bind, t.value); if (t.dataset.after && AFTER[t.dataset.after]) AFTER[t.dataset.after](); }
  if (t.id === 'v-buscar') { const s = t.value.trim().toLowerCase(), l = CARTA.filter(p => p.n.toLowerCase().includes(s)).slice(0, 6); $('rapidos').innerHTML = l.length ? rapidos(l) : '<p class="ayuda">No está en la carta.</p>'; }
  if (t.id === 'm-buscar') { const s = t.value.trim().toLowerCase(); $('m-resto').hidden = !!s;
    const l = FUNCIONES.filter(([a, r]) => (a + ' ' + r).toLowerCase().includes(s));
    $('m-res').innerHTML = !s ? '' : `<div class="grupo"><div class="lista">${l.length ? l.map(([a, r, x]) => fila({ do:'funcion', id:x, t:a, s:r })).join('') : '<p class="vacio">No encontré esa función.</p>'}</div></div>`; }
});
$('tel').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ia-q') DO.iaEnviar(); });
DO.funcion = el => { const [tipo, x] = el.dataset.id.split(':');
  if (tipo === 'tab') irTab(x); else if (tipo === 'go') { S.pila = []; ir(x); } else if (tipo === 'carta') { S.cartaCat = x; irTab('carta'); }
  else { DO.hoja({ dataset:{ h:x } }); } };
$('saltos').addEventListener('click', e => {
  const b = e.target.closest('[data-salto]'); if (!b) return; cerrarHoja(); const s = b.dataset.salto;
  if (s === 'ob') { Object.assign(S.ob, { activo:true, pantalla:'bienvenida', slide:0, paso:0 }); return render(true); }
  S.ob.activo = false; S.pila = [];
  if (['pedidos','carta','vender','caja'].includes(s)) { S.tab = s; render(true); }
  else if (s === 'cierre') { if (!S.caja.abierta) { S.caja.abierta = true; S.caja.cerrado = false; } S.tab = 'caja'; S.cierre.etapa = 1; ir('cierre'); }
  else { S.tab = 'mas'; ir(s); }
});

render();
})();
</script>
