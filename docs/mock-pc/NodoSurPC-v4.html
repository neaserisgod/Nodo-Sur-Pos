<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nodo Sur PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&display=swap" rel="stylesheet">
<style>
/* Concepto: ventana de escritorio 1920×1080 escalada al ancho. Lenguaje de horsepos.com + antigravity.google:
   bloques planos grandes, títulos livianos que se "tipean", pastilla de navegación flotante con mega-menú,
   campo de partículas que huye del mouse, reveal escalonado y cursor-pastilla. Tinta + un azul de acción. */
:root{
  --ink:#121317;--paper:#ffffff;--s:#f3f4f7;--s2:#e6e9ef;--s3:#dde1e9;--mute:#566070;--soft:#7b8494;
  --line:rgba(18,19,23,.12);--hair:rgba(18,19,23,.07);
  --blue:#2f5be8;--blue-d:#1f3fa8;--blue-l:#e8edff;--prim:#121317;--onprim:#ffffff;
  --hero:#121317;--onhero:#ffffff;--herosub:rgba(255,255,255,.62);--herochip:rgba(255,255,255,.1);
  --efe:#0b7a5e;--mix:#b45309;--tar:#4b5563;--mp:#2f5be8;
  --gbg:#e3f6ef;--g:#0b6a52;--bbg:#fbe0de;--b:#a4231b;--wbg:#fdecd6;--w:#7d3b03;--ibg:#e0e9ff;--i:#1d3a9a;
  --scrim:rgba(18,19,23,.46);--navbg:rgba(255,255,255,.66);--navbg2:rgba(255,255,255,.9);--navline:rgba(13,16,23,.08);
  --shell:#e9ebf0;--shell-ink:#121317;--shell-card:#ffffff;--toast:#121317;--ontoast:#ffffff;
  --grad:linear-gradient(100deg,#3b6cff 0%,#8a5cf6 48%,#18c3a4 100%);
  --ease:cubic-bezier(.2,.7,.1,1);--back:cubic-bezier(.34,1.85,.64,1);--quart:cubic-bezier(.165,.84,.44,1);
  --focus:#3b6cff;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef0f4;--paper:#0e0f13;--s:#171a21;--s2:#232733;--s3:#2d3240;--mute:#a0a8b6;--soft:#7e8696;
  --line:rgba(255,255,255,.16);--hair:rgba(255,255,255,.08);
  --blue:#3d68f2;--blue-d:#2f5be8;--blue-l:#17254f;--prim:#3d68f2;--onprim:#ffffff;
  --hero:#1c2231;--herochip:rgba(255,255,255,.1);
  --gbg:#10342a;--g:#63d9b0;--bbg:#3a1613;--b:#ff918a;--wbg:#392510;--w:#f5b56c;--ibg:#17254f;--i:#a3bcff;
  --scrim:rgba(0,0,0,.62);--navbg:rgba(14,15,19,.62);--navbg2:rgba(14,15,19,.9);--navline:rgba(255,255,255,.1);
  --shell:#07080a;--shell-ink:#eef0f4;--shell-card:#14161c;--toast:#2a2e38;--ontoast:#eef0f4;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eef0f4;--paper:#0e0f13;--s:#171a21;--s2:#232733;--s3:#2d3240;--mute:#a0a8b6;--soft:#7e8696;
  --line:rgba(255,255,255,.16);--hair:rgba(255,255,255,.08);
  --blue:#3d68f2;--blue-d:#2f5be8;--blue-l:#17254f;--prim:#3d68f2;--onprim:#ffffff;
  --hero:#1c2231;--herochip:rgba(255,255,255,.1);
  --gbg:#10342a;--g:#63d9b0;--bbg:#3a1613;--b:#ff918a;--wbg:#392510;--w:#f5b56c;--ibg:#17254f;--i:#a3bcff;
  --scrim:rgba(0,0,0,.62);--navbg:rgba(14,15,19,.62);--navbg2:rgba(14,15,19,.9);--navline:rgba(255,255,255,.1);
  --shell:#07080a;--shell-ink:#eef0f4;--shell-card:#14161c;--toast:#2a2e38;--ontoast:#eef0f4;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--shell);color:var(--shell-ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:14px 36px;font-size:16px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent;padding:0;text-align:inherit}
input,select,textarea{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra de herramientas del mock (fuera de la ventana) ---------- */
.tools{max-width:1920px;margin:0 auto 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tools h1{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}
.tools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-right:2px}
.tchip{height:34px;padding:0 14px;border-radius:999px;background:var(--shell-card);font-size:13.5px;font-weight:600;white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--shell-ink);color:var(--shell)}
.tsel{height:34px;border-radius:999px;border:0;background:var(--shell-card);padding:0 12px;font-size:13.5px;font-weight:600;max-width:240px}

/* ---------- ventana ---------- */
#frame{max-width:1920px;margin:0 auto;position:relative}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);color:var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.2);font-size:16px;transition:background .35s,color .35s}
.winbar{position:absolute;left:0;right:0;top:0;height:40px;z-index:70;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 6px 0 18px;font-size:13.5px;font-weight:600;color:var(--mute);background:var(--s)}
.winbar .l,.winbar .m,.winbar .r{display:flex;align-items:center;gap:14px}
.winbar .l{justify-self:start}.winbar .m{justify-self:center}.winbar .r{justify-self:end}
.winbar .m{gap:22px}
.winbar .dot{width:8px;height:8px;border-radius:50%;background:var(--efe);display:inline-block;margin-right:7px}
.winbar .wb{width:46px;height:34px;display:grid;place-items:center;border-radius:10px;color:var(--mute)}
.winbar .wb:hover{background:var(--s2)}
.winbar .wb.x:hover{background:#c5221f;color:#fff}
.logo{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--prim);color:var(--onprim);font-weight:700;font-size:12px;letter-spacing:-.04em;position:relative}
.logo.lg{width:40px;height:40px;border-radius:12px;font-size:16px}
.logo::after{content:"";position:absolute;right:4px;top:4px;width:5px;height:5px;border-radius:50%;background:var(--onprim)}
.logo.lg::after{right:6px;top:6px;width:6px;height:6px}
#view{position:absolute;left:0;right:0;top:40px;bottom:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--s3) transparent;transition:opacity .14s ease,transform .14s ease}
#view.leaving{opacity:0;transform:translateY(-6px)}
#view.fixed{overflow:hidden}
.ic{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ss{scrollbar-width:thin;scrollbar-color:var(--s3) transparent}

/* ---------- navegación: pastilla flotante + mega-menú ---------- */
#hdr{position:absolute;left:0;right:0;top:40px;z-index:60;padding:14px 40px 0;pointer-events:none}
.nav{pointer-events:auto;position:relative;z-index:3;margin:0 auto;max-width:1808px;height:68px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:0 12px;border-radius:999px;background:var(--navbg);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);box-shadow:inset 0 0 0 1px var(--navline);transition:background .3s,box-shadow .3s}
#hdr.lifted .nav{background:var(--navbg2);box-shadow:inset 0 0 0 1px var(--navline),0 10px 40px rgba(13,16,23,.1)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:18px;letter-spacing:-.03em;padding-right:14px;white-space:nowrap}
.links{display:flex;align-items:center;justify-content:center;gap:4px;transition:opacity .25s var(--ease)}
.nl{height:46px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:500;color:var(--mute);display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .2s,color .2s}
.nl:hover,.nl.open{background:var(--s);color:var(--ink)}
.nl[aria-current="page"]{background:var(--s);color:var(--ink);font-weight:600}
.nl .chv{transition:transform .25s var(--ease);opacity:.7}
.nl.open .chv{transform:rotate(180deg)}
.nl.vbtn{background:var(--blue);color:#fff;font-weight:600;padding:0 24px;margin-right:6px}
.nl.vbtn:hover{background:var(--blue-d);color:#fff}
.nl.vbtn[aria-current="page"]{background:var(--blue-d)}
.nr{display:flex;align-items:center;gap:8px;white-space:nowrap;justify-self:end}
.nl-left{justify-self:start;display:flex;align-items:center}
.cajabtn{height:46px;padding:0 16px 0 14px;border-radius:999px;background:var(--s);font-size:15px;font-weight:600;display:inline-flex;align-items:center;gap:10px;transition:background .2s}
.cajabtn:hover,.cajabtn[aria-pressed="true"]{background:var(--s2)}
.cajabtn .dot{width:9px;height:9px;border-radius:50%;background:var(--efe);box-shadow:0 0 0 4px color-mix(in srgb,var(--efe) 22%,transparent)}
.cajabtn .dot.off{background:var(--soft);box-shadow:none}
.cajapop{position:absolute;left:56px;top:128px;z-index:90;width:380px;border-radius:32px;background:var(--paper);box-shadow:0 30px 80px rgba(13,16,23,.25),inset 0 0 0 1px var(--hair);padding:10px;animation:up .22s var(--quart)}
.cajapop .chd{padding:12px 16px 10px;font-size:14px;font-weight:600;color:var(--mute);display:flex;align-items:center;gap:10px}
.cajapop .mi2{width:100%;display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:22px;font-size:17px;font-weight:500;transition:background .15s}
.cajapop .mi2:hover{background:var(--s)}
.cajapop .mi2 small{margin-left:auto;font-size:12.5px;color:var(--soft);font-weight:600}
.cajapop hr{border:0;border-top:1px solid var(--hair);margin:6px 8px}
.cajapop .mi2.red{color:var(--b)}
.cajapop .mi2 .ic{color:var(--mute)}.cajapop .mi2.red .ic{color:var(--b)}
.ci{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--s);position:relative;transition:background .2s,transform .3s var(--ease)}
.ci:hover{background:var(--s2);transform:translateY(-2px)}
.ci[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ci .bd{position:absolute;top:8px;right:9px;min-width:17px;height:17px;border-radius:9px;background:#d93025;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px var(--navbg2)}
.ci .pd{position:absolute;top:10px;right:11px;width:9px;height:9px;border-radius:50%;background:#d93025;box-shadow:0 0 0 2px var(--s)}
.cajachip{height:46px;padding:0 16px;border-radius:999px;background:var(--s);font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:9px}
.cajachip .dot{width:9px;height:9px;border-radius:50%;background:var(--efe);box-shadow:0 0 0 4px color-mix(in srgb,var(--efe) 22%,transparent)}
.sbar{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;gap:12px;padding:0 10px 0 22px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease);border-radius:999px}
.sbar input{flex:1;height:100%;border:0;outline:0;background:transparent;font-size:22px;font-weight:450;letter-spacing:-.02em}
.nav.searching .links,.nav.searching .nr,.nav.searching .brand{opacity:0;pointer-events:none}
.nav.searching .sbar{opacity:1;pointer-events:auto}
.sres{position:absolute;left:40px;right:40px;top:100%;margin:10px auto 0;max-width:1100px;border-radius:36px;background:var(--paper);box-shadow:0 30px 80px rgba(13,16,23,.22),inset 0 0 0 1px var(--navline);padding:12px;pointer-events:auto;z-index:5}
.sres button{width:100%;display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:24px;font-size:18px}
.sres button:hover,.sres button.sel{background:var(--s)}
.mscrim{position:absolute;left:0;right:0;top:40px;bottom:0;background:rgba(18,19,23,.12);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:55}
.mscrim.on{opacity:1;pointer-events:auto}
.mega{position:absolute;left:0;right:0;top:0;z-index:2;padding:92px 120px 40px;background:var(--paper);border-radius:0 0 48px 48px;box-shadow:0 30px 60px rgba(13,16,23,.12);pointer-events:auto;opacity:0;transform:translateY(-14px);visibility:hidden;transition:opacity .2s var(--quart),transform .24s var(--quart),visibility 0s .24s;display:grid;grid-template-columns:1fr 1fr;gap:0}
.mega.on{opacity:1;transform:none;visibility:visible;transition:opacity .2s var(--quart),transform .24s var(--quart)}
.mega .mt{padding-right:40px;display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.mega .mt h3{font-size:36px;line-height:1.05;font-weight:450;letter-spacing:-.045em;margin:0;text-wrap:balance}
.mega .mt p{margin:0;color:var(--mute);font-size:16px;line-height:1.5}
.mega .mc{padding:0 34px;border-left:1px solid var(--hair);display:flex;flex-direction:column;gap:4px}
.mega .mc .ml{font-size:14px;font-weight:600;color:var(--soft);margin-bottom:10px}
.mega .mi{display:flex;align-items:center;gap:14px;padding:11px 14px;margin:0 -14px;border-radius:20px;font-size:18px;font-weight:450;opacity:0;transform:translateY(10px)}
.mega.on .mi{opacity:1;transform:none;transition:opacity .4s var(--quart),transform .4s var(--quart),background .2s;transition-delay:calc(var(--k,0)*25ms + 30ms),calc(var(--k,0)*25ms + 30ms),0s}
.mega .mi:hover{background:var(--s)}
.mega .mi .ic{color:var(--mute)}
.mega .mi small{margin-left:auto;font-size:13px;color:var(--soft);font-weight:500}

/* ---------- tipografía y piezas comunes ---------- */
.h1{font-size:48px;line-height:1.05;font-weight:450;letter-spacing:-.045em;margin:0;text-wrap:balance}
.h2{font-size:34px;line-height:1.04;font-weight:450;letter-spacing:-.045em;margin:0;text-wrap:balance}
.h3{font-size:28px;line-height:1.1;font-weight:450;letter-spacing:-.035em;margin:0}
.lead{font-size:21px;line-height:1.5;color:var(--mute);margin:0;text-wrap:pretty}
.mute{color:var(--mute)}.soft{color:var(--soft)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--mute);letter-spacing:.005em}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--blue);flex:none}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ch{display:inline;opacity:0}
.ch.on{opacity:1}
.grad .ch{-webkit-text-fill-color:transparent}
.caret{display:inline-block;width:.055em;height:.82em;margin-left:.08em;border-radius:3px;vertical-align:-.04em;background:linear-gradient(#4f7cff,#b05cf0 40%,#ff6a5c 70%,#f6c343);animation:blink 1.1s steps(1) infinite;transition:opacity .5s}
.caret.off{opacity:0}
@keyframes blink{50%{opacity:.15}}
.kbd{display:inline-block;padding:3px 8px;border-radius:8px;background:color-mix(in srgb,currentColor 9%,transparent);font-size:12px;font-weight:600;letter-spacing:.02em;line-height:1.3;opacity:.8;white-space:nowrap}
.btn{height:56px;padding:0 28px;border-radius:999px;background:var(--prim);color:var(--onprim);font-size:17px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;white-space:nowrap;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(18,19,23,.2)}
.btn:active{transform:scale(.98);box-shadow:none}
.btn.blue{background:var(--blue);color:#fff}
.btn.blue:hover{background:var(--blue-d);box-shadow:0 14px 34px rgba(47,91,232,.32)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.ton{background:var(--s);color:var(--ink)}
.btn.ton:hover{background:var(--s2);box-shadow:none}
.btn.out{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.out:hover{background:var(--s);box-shadow:inset 0 0 0 1.5px var(--line)}
.card .btn.ton,.ticket .btn.ton,.list .btn.ton{background:var(--paper)}
.card .btn.ton:hover,.ticket .btn.ton:hover,.list .btn.ton:hover{background:var(--s2)}
.btn.ai{background:var(--blue-l);color:var(--blue)}
.btn.ai:hover{background:color-mix(in srgb,var(--blue) 18%,var(--blue-l));box-shadow:none}
.btn.red{background:var(--bbg);color:var(--b)}
.btn.sm{height:44px;padding:0 20px;font-size:15px}
.btn.xs{height:36px;padding:0 15px;font-size:14px}
.btn.lg{height:76px;padding:0 34px;font-size:21px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn .go{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-right:-14px}
.btn.lg .go{width:54px;height:54px}
.chip{height:46px;padding:0 17px;border-radius:999px;font-size:16px;font-weight:500;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);background:var(--paper);white-space:nowrap;transition:background .2s,box-shadow .2s,transform .3s var(--ease);display:inline-flex;align-items:center;gap:8px}
.chip:hover{background:var(--s);transform:translateY(-1px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.chip.sm{height:38px;padding:0 16px;font-size:14.5px}
.seg{display:inline-flex;padding:5px;border-radius:999px;background:var(--s);gap:2px}
.seg button{height:46px;padding:0 24px;border-radius:999px;font-size:16px;font-weight:600;color:var(--mute);transition:background .25s var(--ease),color .2s,box-shadow .25s;white-space:nowrap;text-align:center}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 10px rgba(13,16,23,.1)}
.seg.fill{display:flex}.seg.fill button{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;font-size:13.5px;font-weight:600;white-space:nowrap;background:var(--s2);color:var(--mute)}
.tag.g{background:var(--gbg);color:var(--g)}.tag.b{background:var(--bbg);color:var(--b)}.tag.w{background:var(--wbg);color:var(--w)}.tag.i{background:var(--ibg);color:var(--i)}
.tag.dark{background:var(--ink);color:var(--paper)}
.card{background:var(--s);border-radius:32px;padding:22px 28px}
.card.line{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--line)}
.card.w{background:var(--wbg);color:var(--w)}.card.g{background:var(--gbg);color:var(--g)}.card.b{background:var(--bbg);color:var(--b)}.card.i{background:var(--ibg);color:var(--i)}
.hero{background:var(--hero);color:var(--onhero);border-radius:34px;padding:24px 30px}
.hero .sub{color:var(--herosub)}
.hero.blue{background:var(--blue)}
.fig{font-size:44px;line-height:1;font-weight:450;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:1px;background:var(--hair);border-radius:30px;overflow:hidden}
.list>*{background:var(--s)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;min-height:52px;font-size:16px;color:var(--mute);width:100%}
.kv b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
button.kv{transition:background .2s}
button.kv:hover{background:var(--s2)}
.field{background:var(--s);border-radius:28px;padding:14px 24px 12px;display:flex;flex-direction:column;gap:3px;transition:box-shadow .2s}
.field:focus-within{box-shadow:0 0 0 2.5px var(--focus)}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field select,.field textarea{border:0;outline:0;background:transparent;font-size:21px;font-weight:500;width:100%;padding:0;letter-spacing:-.01em}
.field .val{font-size:21px;font-weight:500}
.field.big input{font-size:56px;font-weight:450;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1.15}
.field.big{padding:16px 28px 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:20px;width:100%;padding:14px 24px;min-height:64px;background:var(--s);text-align:left}
.tg .t{font-size:18px;font-weight:600}.tg .d{font-size:14.5px;color:var(--mute);margin-top:3px;line-height:1.35}
.track{width:56px;height:32px;border-radius:999px;background:var(--s3);position:relative;flex:none;transition:background .3s var(--ease)}
.track i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .35s var(--back)}
.track.on{background:var(--blue)}.track.on i{transform:translateX(24px)}
.ibox{width:46px;height:46px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none;color:var(--ink)}
.ibox.sm{width:38px;height:38px}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;flex:none}
.bar{height:16px;border-radius:999px;background:var(--s3);overflow:hidden;display:flex}
.bar i{display:block;height:100%;width:0;transition:width .7s var(--ease)}
.ckb{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;box-shadow:inset 0 0 0 1.8px var(--line);color:transparent;background:var(--paper);transition:background .15s,box-shadow .15s,color .15s}
.ckb[aria-pressed="true"]{background:var(--blue);box-shadow:none;color:#fff}
.ckb:hover{box-shadow:inset 0 0 0 1.8px var(--ink)}.ckb[aria-pressed="true"]:hover{box-shadow:none}
.tbl{width:100%;border-collapse:collapse;font-size:16px}
.tbl th{font-size:13px;font-weight:600;color:var(--soft);text-align:left;padding:14px 22px;background:var(--s);position:sticky;top:0}
.tbl td{padding:11px 20px;border-top:1px solid var(--hair);background:var(--s)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr{transition:background .15s}.tbl tbody tr:hover td{background:var(--s2)}
.sec{font-size:15px;font-weight:600;color:var(--mute);margin:0;display:flex;align-items:center;gap:10px}
.sec::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--blue)}
.note{border-radius:24px;padding:16px 22px;font-size:15px;line-height:1.5;background:var(--s);color:var(--mute)}
.note.w{background:var(--wbg);color:var(--w)}.note.g{background:var(--gbg);color:var(--g)}.note.b{background:var(--bbg);color:var(--b)}.note.i{background:var(--ibg);color:var(--i)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;color:var(--mute);font-size:19px;line-height:1.4}

/* ---------- reveal (horsepos .rv) y pulsos ---------- */
.js .rv{opacity:0;transform:translateY(10px);transition:opacity .4s var(--ease) var(--d,0ms),transform .4s var(--ease) var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}
.js .rv.in.hv{transition:opacity .4s var(--ease) var(--d,0ms),transform .4s var(--ease),background .3s}
.hv{transition:transform .5s var(--ease),background .4s,box-shadow .5s}
.hv:hover{transform:translateY(-2px)}
.pop{animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes msg{from{opacity:0;transform:translateY(10px) scale(.96)}}
@keyframes dot{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.7);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes marq{to{transform:translateX(calc(-50% - 6px))}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.still *,.still{animation:none!important}
.nomotion *{animation-duration:.001s!important;transition-duration:.001s!important}
.nomotion .rv{opacity:1!important;transform:none!important}

/* ---------- páginas (gestión) ---------- */
.page{position:absolute;inset:0;padding:100px 56px 26px;display:flex;flex-direction:column;gap:16px;min-height:0}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex:none}
.phead .acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pbody{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.list.scrl:has(>table){flex:0 1 auto!important;align-self:start;max-height:100%;width:100%}
.scrl{overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--s3) transparent}
.pfx{position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
canvas.particles{display:block;width:100%;height:100%}

/* ---------- Venta ---------- */
.venta{position:absolute;inset:0;display:grid;grid-template-columns:1fr 620px;gap:24px;padding:100px 56px 26px 56px}
.vizq{position:relative;display:flex;flex-direction:column;gap:18px;min-width:0;min-height:0}
.vizq>*{position:relative}
.vfx{position:absolute!important;left:-56px;right:-20px;top:-122px;height:420px;pointer-events:none;-webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent);opacity:.55}
.vtop{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.vtop .h1{font-size:40px}
.vsw{position:relative;display:flex;gap:12px}
.sbig{flex:1 0 auto;height:72px;border-radius:999px;background:var(--s);display:flex;align-items:center;gap:16px;padding:0 30px;font-size:24px;transition:box-shadow .25s,background .25s}
.sbig:focus-within{box-shadow:0 0 0 3px var(--focus);background:var(--paper)}
.sbig input{flex:1;border:0;outline:0;background:transparent;font-size:22px;font-weight:450;letter-spacing:-.02em;min-width:0}
.vsw .btn.ton{height:72px;padding:0 24px;font-size:17px}
.drop{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:30;border-radius:36px;background:var(--paper);box-shadow:0 30px 80px rgba(13,16,23,.22),inset 0 0 0 1px var(--hair);padding:12px;animation:up .22s var(--quart)}
.drop button{width:100%;display:flex;align-items:center;gap:16px;padding:14px 22px;border-radius:26px;font-size:21px;font-weight:450}
.drop button.sel,.drop button:hover{background:var(--s)}
.drop .st{margin-left:auto;font-size:15px;color:var(--mute)}
.drop .p{font-weight:600;font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
.vcats{display:flex;gap:8px;flex-wrap:wrap}
.vgrid{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:max-content;gap:14px;padding:4px 6px 14px 4px;margin:-4px -6px 0 -4px;align-content:start}
.tile{position:relative;border-radius:30px;background:var(--s);padding:20px 22px 20px;display:flex;flex-direction:column;gap:10px;min-height:150px;text-align:left;box-shadow:inset 0 0 0 2px transparent;transition:transform .45s var(--ease),background .3s,box-shadow .3s;animation:tin .3s var(--ease) both;animation-delay:calc(var(--k,0)*12ms)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.tile:hover{background:var(--s2)}
.tile:active{transform:scale(.98)}
.tile .n{font-size:18px;font-weight:500;line-height:1.2;margin-top:auto;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .p{font-size:25px;font-weight:500;letter-spacing:-.035em;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.tile .p small{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--wbg);color:var(--w);letter-spacing:0}
.tile .cnt{position:absolute;top:16px;right:18px;min-width:30px;height:30px;border-radius:15px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center;padding:0 8px;animation:pop .45s var(--ease)}
.tile.on{background:var(--blue-l);box-shadow:inset 0 0 0 2px var(--blue)}
.tile.out{opacity:.45;pointer-events:none}
.vder{display:flex;flex-direction:column;gap:14px;min-height:0;background:var(--s);border-radius:52px;padding:22px 22px 22px}
.vtabs{display:flex;gap:6px;align-items:center;padding:0 4px}
.vtab{height:42px;padding:0 18px;border-radius:999px;font-size:15px;font-weight:600;color:var(--mute);display:inline-flex;align-items:center;gap:8px;transition:background .2s}
.vtab:hover{background:var(--s2)}
.vtab[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 2px 10px rgba(13,16,23,.08)}
.vtg{display:inline-flex;align-items:center;gap:0}
.vx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--soft);margin-left:-8px;margin-right:6px;transition:background .15s}
.vx:hover{background:var(--bbg);color:var(--b)}
.vtab .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;opacity:.5}.vtab .x:hover{background:var(--s3);opacity:1}
.cart{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:2px 4px}
.cl{display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:12px;padding:12px 14px 12px 18px;border-radius:28px;background:var(--paper);box-shadow:inset 0 0 0 2px transparent}
.cl.new{animation:msg .4s var(--ease)}
.cl.last{box-shadow:inset 0 0 0 2px var(--blue)}
.cl .n{font-size:17px;font-weight:500;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cl.neg .n{color:var(--b)}
.cl .u{font-size:13px;color:var(--soft);margin-top:2px}
.stp{display:inline-flex;align-items:center;gap:2px;background:var(--s);border-radius:999px;padding:3px}
.stp button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;transition:background .15s}
.stp button:hover{background:var(--s3)}
.stp b{min-width:54px;text-align:center;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;cursor:text}
.cl .sub{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
.cl .rm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}.cl .rm:hover{background:var(--bbg);color:var(--b)}
.tot{border-radius:44px;padding:20px 30px 18px;background:var(--hero);color:var(--onhero);position:relative;overflow:hidden}
.tot .lbl{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:var(--herosub)}
.tot .big{font-size:76px;line-height:1;font-weight:450;letter-spacing:-.06em;margin:6px 0 6px;font-variant-numeric:tabular-nums}
.tot .des{display:flex;gap:8px;flex-wrap:wrap;min-height:30px}
.tot .des span{height:30px;padding:0 13px;border-radius:999px;background:var(--herochip);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;color:var(--onhero)}
.dbtn{height:36px;padding:0 15px;border-radius:999px;background:var(--herochip);color:var(--onhero);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .2s}
.dbtn:hover{background:rgba(255,255,255,.2)}
.medios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medio{height:72px;border-radius:30px;background:var(--paper);display:flex;align-items:center;gap:14px;padding:0 20px;transition:background .3s var(--ease),color .3s,transform .3s var(--ease);text-align:left}
.medio:hover{transform:translateY(-2px)}
.medio .ibox{background:var(--s);transition:background .3s,color .3s}
.medio .t{font-size:20px;font-weight:600;letter-spacing:-.02em}
.medio .k{font-size:12px;font-weight:600;opacity:.55;letter-spacing:.05em;margin-top:2px}
.medio[aria-pressed="true"]{color:#fff;animation:pop .45s var(--ease)}
.medio[aria-pressed="true"] .ibox{background:rgba(255,255,255,.22);color:#fff}
.medio.efe[aria-pressed="true"]{background:var(--efe)}.medio.qr[aria-pressed="true"]{background:var(--mp)}.medio.tar[aria-pressed="true"]{background:var(--tar)}.medio.mix[aria-pressed="true"]{background:var(--mix)}
.cobrar{height:78px;border-radius:999px;background:var(--blue);color:#fff;font-size:24px;font-weight:600;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 38px;transition:transform .3s var(--ease),box-shadow .3s,background .3s}
.cobrar:hover{transform:translateY(-2px);box-shadow:0 18px 40px rgba(47,91,232,.35);background:var(--blue-d)}
.cobrar:active{transform:scale(.98)}
.cobrar[disabled]{opacity:.38;pointer-events:none}
.cobrar .go{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.manual{font-size:14px;font-weight:600;color:var(--mute);text-align:center;height:30px}

/* ---------- Inicio ---------- */
.ihero{position:relative;text-align:center;padding:176px 64px 0;display:flex;flex-direction:column;align-items:center;gap:26px;isolation:isolate}
.pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 10px;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line);font-size:15px;font-weight:500;color:var(--mute);background:transparent}
.pill b{background:var(--ink);color:var(--paper);border-radius:999px;font-size:12px;font-weight:600;padding:4px 11px}
.ihero .h1{font-size:92px;max-width:1380px;letter-spacing:-.058em}
.ihero .lead{max-width:860px}
.stage3d{perspective:1800px;padding:0 64px;margin-top:20px;--p:0}
.stage3d .frame{border-radius:56px;background:var(--s);padding:30px;transform:rotateX(calc((1 - var(--p)) * 16deg)) scale(calc(.93 + var(--p) * .07));transform-origin:50% 100%;will-change:transform;box-shadow:0 40px 90px -30px rgba(13,16,23,.28)}
.dgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px}
.mq{padding:46px 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-t{display:flex;gap:12px;width:max-content;animation:marq 48s linear infinite}
.mq-t:hover{animation-play-state:paused}
.quien{font-size:68px;line-height:1.04;font-weight:450;letter-spacing:-.05em;max-width:19ch;text-wrap:balance}
.quien .w{opacity:.2;transition:opacity .4s}.quien .w.on{opacity:1}
.bars{display:flex;align-items:flex-end;gap:8px;flex:1;min-height:0}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:10px;height:100%}
.bars i{display:block;width:100%;border-radius:12px;background:var(--s3);height:0;transition:height .6s var(--ease);transition-delay:calc(var(--k,0)*25ms)}
.bars i.hi{background:var(--blue)}
.bars span{font-size:13px;color:var(--soft);font-weight:600}
.carr{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 64px 8px;margin:0 -64px}
.carr::-webkit-scrollbar{display:none}
.carr>*{scroll-snap-align:start;flex:none}
.cb{width:56px;height:56px;border-radius:50%;background:var(--s);display:grid;place-items:center;transition:background .25s,transform .25s var(--ease)}
.cb:hover:not(:disabled){background:var(--s2);transform:translateY(-2px)}.cb:disabled{opacity:.35}

/* ---------- listas maestro/detalle ---------- */
.md{display:grid;gap:22px;min-height:0}
.rowb{display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:26px;background:var(--s);width:100%;text-align:left;transition:background .2s,transform .4s var(--ease),box-shadow .25s;box-shadow:inset 0 0 0 2px transparent}
.rowb:hover{background:var(--s2)}
.rowb[aria-pressed="true"],.rowb.sel{background:var(--blue-l);box-shadow:inset 0 0 0 2px var(--blue)}
.rowb .t{font-size:17px;font-weight:550}.rowb .d{font-size:14.5px;color:var(--mute);margin-top:2px}
.rowb .r{margin-left:auto;text-align:right;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ticket{background:var(--s);border-radius:36px;padding:26px 30px;display:flex;flex-direction:column;gap:12px}
.ticket hr{border:0;border-top:2px dashed var(--line);margin:8px 0;width:100%}
.ln{display:flex;justify-content:space-between;gap:14px;font-size:18px;font-variant-numeric:tabular-nums}
.sep-ck{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;transition:background .25s,box-shadow .25s;color:transparent}
.on .sep-ck{background:var(--g);box-shadow:none;color:#fff}
.cfgnav{display:flex;flex-direction:column;gap:4px;min-width:0}
.cgrp{font-size:12px;font-weight:700;color:var(--soft);padding:12px 16px 4px;letter-spacing:.03em;text-transform:uppercase}
.csec{height:40px;padding:0 16px;border-radius:999px;font-size:16px;font-weight:500;color:var(--mute);display:flex;align-items:center;justify-content:space-between;transition:background .2s,color .2s}
.csec:hover{background:var(--s);color:var(--ink)}
.csec[aria-current="true"]{background:var(--ink);color:var(--paper);font-weight:600}

/* ---------- modales (al centro) ---------- */
#mlayer{position:absolute;inset:0;z-index:200;pointer-events:none}
.mscr{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(6px);opacity:0;pointer-events:auto;transition:opacity .25s}
.mscr.on{opacity:1}
.mwrap{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:50px}
.modal{pointer-events:auto;width:760px;max-height:calc(1080px - 100px);display:flex;flex-direction:column;background:var(--paper);border-radius:48px;box-shadow:0 40px 100px rgba(13,16,23,.35);transform:translateY(22px) scale(.96);opacity:0;transition:transform .32s var(--ease),opacity .25s}
.modal.on{transform:none;opacity:1}
.modal.w{width:1060px}.modal.n{width:620px}
.mhead{padding:36px 40px 6px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mhead .h2{font-size:38px}
.mhead .x{width:46px;height:46px;border-radius:50%;background:var(--s);display:grid;place-items:center;flex:none;transition:background .2s,transform .3s var(--ease)}
.mhead .x:hover{background:var(--s2);transform:rotate(90deg)}
.mbody{padding:14px 40px 8px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;min-height:0;scrollbar-width:thin}
.mfoot{padding:16px 40px 36px;display:flex;flex-direction:column;gap:10px}
.mfoot.row{flex-direction:row}.mfoot.row>*{flex:1}
.mock-only{border-radius:22px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--soft);font-weight:600}
.mock-only .chip{height:32px;padding:0 13px;font-size:13px}
.toast{position:absolute;left:50%;top:58px;transform:translate(-50%,-26px);opacity:0;z-index:300;background:var(--toast);color:var(--ontoast);height:60px;border-radius:999px;padding:0 30px 0 22px;display:flex;align-items:center;gap:12px;font-size:17px;font-weight:600;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:transform .45s var(--back),opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.popn{position:absolute;right:130px;top:128px;z-index:90;width:520px;border-radius:40px;background:var(--paper);box-shadow:0 30px 80px rgba(13,16,23,.25),inset 0 0 0 1px var(--hair);padding:26px;display:flex;flex-direction:column;gap:12px;animation:up .26s var(--quart)}
#cur{position:absolute;left:0;top:0;z-index:400;pointer-events:none;opacity:0;transform:translate(-100px,-100px);will-change:transform}
#cur .in{display:flex;align-items:center;gap:8px;height:42px;padding:0 18px 0 12px;border-radius:999px;background:var(--paper);color:var(--ink);box-shadow:0 8px 30px rgba(13,16,23,.18),inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:600;white-space:nowrap;transform:scale(0);transform-origin:0 0;transition:transform .3s var(--back)}
#cur.on .in{transform:scale(1)}
.draw{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .6s .15s var(--ease) forwards}
.spin{animation:spin 1s linear infinite}
.ringp{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 3px var(--blue);animation:ring 1.8s var(--ease) infinite}
.kbdhelp{display:grid;grid-template-columns:1fr 1fr;gap:6px 30px}
.kbdhelp div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:16px}
.cp{position:absolute;left:50%;top:110px;transform:translateX(-50%);width:900px;z-index:210;background:var(--paper);border-radius:40px;box-shadow:0 40px 100px rgba(13,16,23,.35);padding:14px;animation:up .24s var(--quart)}
.cp input{width:100%;height:68px;border:0;outline:0;background:var(--s);border-radius:999px;padding:0 30px;font-size:22px;font-weight:450;margin-bottom:8px}
.cp .it{width:100%;display:flex;align-items:center;gap:14px;padding:12px 20px;border-radius:24px;font-size:18px}
.cp .it.sel{background:var(--s)}.cp .it.dis{opacity:.5}.cp .it small{margin-left:auto;color:var(--soft);font-size:13px}

 var x=prod(id);if(x.st<=0){toast('Sin stock: no se puede agregar');return}
 var s=sale(),l=find(id),step=x.kg?(g||50):1;
 if(l)l.q+=step;else s.lines.push({id:id,q:x.kg?(g||250):1});
 s.last=id;lastNew=l?null:id;
 var q=$q('#q');if(q){q.value='';q.focus()}
 drawDrop();drawCart();drawTotals();syncTiles();
}
NS.addProd=addProd;
A.add=function(id){addProd(id,0)};
A.addg=function(arg){var p=arg.split(':');addProd(p[0],parseInt(p[1],10)||0)};
A.cat=function(c){S.cat=c;drawCats();drawGrid()};
A.vtab=function(i){S.cur=parseInt(i,10);drawAll()};
A.newsale=function(){if(S.screen!=='venta'){go('venta',{},false);return}S.sales.push({id:S.nextSale++,lines:[],medio:'efectivo',desc:{t:'pct',v:0},last:null});S.cur=S.sales.length-1;drawAll();var q=$q('#q');if(q)q.focus();toast('Venta nueva abierta · '+S.sales.length+' abiertas')};
A.step=function(arg){var p=arg.split(':'),s=sale(),l=s.lines[parseInt(p[0],10)],x=prod(l.id),d=parseInt(p[1],10)*(x.kg?50:1);l.q+=d;if(l.q<=0)s.lines.splice(parseInt(p[0],10),1);else s.last=l.id;drawCart();drawTotals();syncTiles()};
A.rm=function(i){var s=sale(),idx=parseInt(i,10),l=s.lines.splice(idx,1)[0];toast('Quitaste '+prod(l.id).n,function(){s.lines.splice(idx,0,l);drawCart();drawTotals();syncTiles()});drawCart();drawTotals();syncTiles()};
A.qedit=function(i){openM('cantidad',{i:parseInt(i,10)})};
A.medio=function(m){var s=sale();s.medio=m;drawTotals();if(m==='efectivo')return;};
A.cobrar=function(){openCobrar()};
A.manual=function(){var s=sale();if(!s.lines.length||(s.medio!=='qr'&&s.medio!=='tarjeta'))return;finishSale({manual:true,canal:s.medio==='qr'?'qr':'debito'})};
function openCobrar(){
 var s=sale();
 if(!s.lines.length){toast('El carrito está vacío');return}
 if(!s.medio){toast('Elegí un medio de pago (Alt+E, Alt+Q, Alt+D o Alt+X)');return}
 if(s.medio==='efectivo')openM('efectivo',{pay:0});
 else if(s.medio==='mixto')openM('mixto',{ef:0});
 else openM('canal',{canal:s.medio==='qr'?'qr':'debito'});
}
NS.openCobrar=openCobrar;
function finishSale(o){
 var s=sale(),c=calc(s);
 var canal=o.canal||(s.medio==='efectivo'?'efectivo':s.medio);
 var med=s.medio==='efectivo'?'Efectivo':s.medio==='mixto'?'Mixto':canal==='credito'?'Crédito':canal==='debito'?'Débito':'Mercado Pago';
 var ven={n:1186+(NS.VENTAS.length-5),h:'13:0'+Math.floor(Math.random()*9),medio:med,total:c.total,ganancia:Math.round(c.total*.31),lines:s.lines.map(function(l){var x=prod(l.id);return [(x.kg?l.q+' g ':l.q+' × ')+x.n,lineSub(l)]}),red:c.red};
 NS.VENTAS.unshift(ven);
 openM('cobrada',{total:c.total,medio:med,vuelto:o.vuelto||0,manual:o.manual,n:ven.n,mixto:o.mixto});
}
function endSale(){
 var s=sale();
 if(S.sales.length>1){S.sales.splice(S.cur,1);S.cur=Math.min(S.cur,S.sales.length-1)}
 else{s.lines=[];s.medio='efectivo';s.desc={t:'pct',v:0};s.last=null;s.id=S.nextSale++}
 prevTotal=0;drawAll();var q=$q('#q');if(q){q.value='';q.focus()}
}
A.nueva=function(){clearTimeout(NS._cobT);closeM();endSale()};
A.imprimir=function(){clearTimeout(NS._cobT);var d=MS.d||{};openM('imprimir',{n:d.n,total:d.total,medio:d.medio,fromCobro:MS.name==='cobrada'})};

/* teclado propio de Venta */
NS.venta={
 key:function(e,alt,typing){
  var k=e.key.toLowerCase();
  if(alt){
   var map={e:'efectivo',q:'qr',d:'tarjeta',x:'mixto'};
   if(map[k]){e.preventDefault();A.medio(map[k]);return true}
   if(k==='m'){e.preventDefault();A.manual();return true}
   if(k==='v'){e.preventDefault();openM('varios');return true}
   if(k==='i'){e.preventDefault();openM('movimiento',{tipo:'ingreso'});return true}
   if(k==='g'){e.preventDefault();openM('movimiento',{tipo:'gasto'});return true}
   if(k==='n'){e.preventDefault();A.newsale();return true}
   if(k==='s'){e.preventDefault();A.vtab((S.cur+1)%S.sales.length);return true}
   if(k==='c'){e.preventDefault();A.caramelo();return true}
  }
  if(e.key==='-'&&!typing){e.preventDefault();openM('movimiento',{tipo:'gasto'});return true}
  if(e.key==='-'&&typing&&e.target.id==='q'&&!e.target.value){e.preventDefault();openM('movimiento',{tipo:'gasto'});return true}
  return false;
 },
 esc:function(){var q=$q('#q');if(q&&q.value){q.value='';drawDrop();return}var s=sale();if(s.lines.length){var bak={lines:s.lines,medio:s.medio,desc:s.desc,last:s.last};s.lines=[];s.medio='efectivo';s.last=null;s.desc={t:'pct',v:0};drawAll();toast('Cancelaste la venta',function(){s.lines=bak.lines;s.medio=bak.medio;s.desc=bak.desc;s.last=bak.last;drawAll()})}}
};
A.caramelo=function(){addProd('caramelo',0);toast('Caramelo agregado al vuelto')};

 after:function(v,o){
  drawCats();drawGrid();prevTotal=0;drawAll();
  var q=$q('#q');
  q.addEventListener('input',function(){S.dropIdx=0;drawDrop()});
  q.addEventListener('keydown',function(e){
   var r=dropResults();
   if(e.key==='ArrowDown'&&r.length){e.preventDefault();S.dropIdx=(S.dropIdx+1)%r.length;drawDrop()}

   }
  });
  NS.typePlaceholder(q,['Escaneá un código o buscá un producto','200 queso barra','coca 2,25 l','7790001000011']);
  if(o&&o.q){q.value=o.q;drawDrop()}
  setTimeout(function(){q.focus()},50);
  if(!S.caja.abierta)setTimeout(function(){openM('apertura',{nodismiss:1})},400);
 }
};

NS.modalKey=function(e,alt,typing){

 var k=e.key;
 if(MS.name==='cobrada'){if(['Shift','Control','Alt','Meta','Tab','CapsLock'].indexOf(k)<0&&!e.repeat&&Date.now()-(MS.t||0)>300){A.nueva();var qq=$q('#q');if(qq)qq.focus()}return true}
 if(MS.name==='pagarRapido'&&NS.pagKey&&NS.pagKey(e))return true;

M.descuento=function(d){
 var s=sale(),b=calc(Object.assign({},s,{desc:{t:'pct',v:0}})).bruto;

var NS=window.NS,S=NS.S,A=NS.A,M=NS.M,MS=NS.MS,P=NS.P,PROV=NS.PROV,F=NS.F,$=NS.$,esc=NS.esc,ic=NS.ic,$q=NS.$q,prod=NS.prod,toast=NS.toast,openM=NS.openM,closeM=NS.closeM,renderM=NS.renderM,go=NS.go;
var J=NS.JUMPS,fld=F.field;

/* ---- anular una venta cobrada con la terminal → ofrecer devolver por Mercado Pago ---- */
A.anulok=function(){
 var d=MS.d;if(!d.mot){toast('El motivo es obligatorio');return}
 var v=NS.VENTAS.filter(function(x){return x.n===S.hSel})[0]||NS.VENTAS[0];
 if(v.medio==='Efectivo'){closeM();toast('Venta anulada · stock y caja revertidos');return}
 openM('devolverMP',{n:v.n,t:v.total,medio:v.medio},true);
};
M.devolverMP=function(d){
 return{h:'¿Devolver '+$(d.t)+' al cliente por Mercado Pago?',sub:'La venta #'+d.n+' se cobró con la terminal ('+$(d.t)+'). ¿Devolvérselo al cliente por Mercado Pago?',w:'w',
  b:F.note('La venta ya queda anulada y el stock vuelve al local. Esto solo decide si la plata se devuelve desde Mercado Pago.'),
  f:'<button type="button" class="btn lg blue wide" data-a="devok">Sí, devolver '+$(d.t)+'</button><button type="button" class="btn out wide" data-a="devno">No, devuelvo yo</button>'};
};
A.devok=function(){var t=MS.d.t;closeM();toast('Listo: se le devolvieron '+$(t)+' al cliente por Mercado Pago')};
A.devno=function(){closeM();toast('Venta anulada · la plata la devolvés vos fuera de la app')};

/* ---- cierre: diferencia de Mercado Pago como gasto o ingreso ---- */
A.cmpmov=function(t){openM('movimiento',{tipo:t,caja:'mp',monto:1400,motivo:'Diferencia con Mercado Pago'})};

/* ---- retirar ganancia con aviso de "te pasás" ---- */
M.retirar=function(d){
 var disp=26000,rt=Number(d.rt)||0,pasa=rt>disp;
 return{h:'Retirar ganancia',sub:'Retiro semanal · hoy podés retirar '+$(disp),w:pasa?'w':'n',
  b:fld('rt','Querés retirar',d.rt||'','$ 0',{big:1,money:1,auto:1})+F.seg('ro',[['cajon','Del cajón'],['mp','Mercado Pago']],d.ro||'cajon')+
  (pasa?F.note('<b>Estás retirando más de lo que el negocio ganó.</b>','w')+F.list([F.kv('Ganancia bruta del mes',$(1482000)),F.kv('Gastos fijos y variables','−'+$(1106000)),F.kv('Ya retirado este mes','−'+$(50000)),F.kv('Retirable hoy',$(disp)),F.kv('Te pasás por','<span style="color:var(--b)">'+$(rt-disp)+'</span>')]):F.note('Calculado según cómo se cobraron las ventas — se puede corregir. Lo retirado se resta de lo que te queda y queda anotado.')),
  f:F.foot(pasa?'Retirar igual':'Registrar retiro','toast:Retiro registrado',false,'',pasa?'red':'blue')};
};

/* ---- fijos: cargar monto del mes y sueldo del dueño ---- */
M.cargarMonto=function(d){return{h:'Cargar monto de este mes',sub:esc(d.arg||'Contador'),w:'n',b:fld('cm','Monto de este mes',d.cm||'','$ 0',{big:1,money:1,auto:1}),f:F.foot('Guardar','cmok')}};
A.cmok=function(){if(!MS.d.cm){toast('El monto tiene que ser mayor a cero');return}closeM();toast('Monto guardado · '+$(MS.d.cm))};
M.sueldo=function(d){return{h:'Sueldo del dueño',sub:'Es el sueldo objetivo: se descuenta del resultado para saber cuánto queda para el negocio.',w:'n',b:fld('sd','Sueldo objetivo por mes',d.sd==null?300000:d.sd,'$ 0',{big:1,money:1,auto:1}),f:F.foot('Guardar','toast:Sueldo del dueño guardado')}};

J.push(['devmp','Anular con devolución por Mercado Pago',function(){S.hSel=1184;go('historial',{tab:'Ventas',force:true},true);setTimeout(function(){NS.openM('devolverMP',{n:1184,t:22800,medio:'Débito'})},400)}]);
J.push(['hmes','Historial · Este mes',function(){S.hPer='Este mes';go('historial',{tab:'Ventas',force:true},true)}]);
J.push(['retirarpasa','Retirar de más (aviso)',function(){go('inicio',{tab:'mes'},true);setTimeout(function(){NS.openM('retirar',{rt:40000})},400)}]);
J.push(['sepsem','Separaciones · Semana',function(){S.sepPer='Semana';go('separaciones',{force:true},true)}]);
J.push(['cmonto','Fijos · cargar monto',function(){go('inicio',{tab:'mes'},true);setTimeout(function(){NS.openM('cargarMonto',{arg:'Contador'})},400)}]);
})();
(function(){})();
(function(){
var NS=window.NS;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',NS.boot);else NS.boot();
})();
</script></body></html>
