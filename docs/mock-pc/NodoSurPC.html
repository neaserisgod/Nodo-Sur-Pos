<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nodo Sur PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Layout: ventana de PC 1920x1080 escalada al ancho; navbar superior, Venta con carrito+cobro a la derecha.
   Paleta y medidas: las del mock del celular (Nodo Sur · App del celular), pasadas a escritorio. */
:root{
  --ink:#121317;--paper:#fff;--s:#f3f4f7;--s2:#e1e4ea;--mute:#566070;--line:#c4c9d4;
  --prim:#121317;--hero:#121317;--toast:#121317;
  --gbg:#e3f6ef;--g:#0b6a52;--bbg:#fbe0de;--b:#a4231b;--wbg:#fdecd6;--w:#7d3b03;--ibg:#e0e9ff;--i:#1d3a9a;
  --blue:#2f5be8;--blue-d:#1f3fa8;--hair:rgba(18,19,23,.08);--scrim:rgba(18,19,23,.5);
  --efe:#0b7a5e;--mix:#b45309;--tar:#4b5563;--focus:#3b6cff;
  --shell:#e9ebf0;--shell-ink:#121317;--shell-card:#fff;
  --ease:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#eef0f4;--paper:#0e0f13;--s:#1a1d24;--s2:#2a2e38;--mute:#a0a8b6;--line:#3b4150;
  --prim:#2f5be8;--hero:#1c2231;--toast:#2a2e38;
  --gbg:#10342a;--g:#63d9b0;--bbg:#3a1613;--b:#ff918a;--wbg:#392510;--w:#f5b56c;--ibg:#17254f;--i:#a3bcff;
  --hair:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);
  --shell:#07080a;--shell-ink:#eef0f4;--shell-card:#14161c;color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#eef0f4;--paper:#0e0f13;--s:#1a1d24;--s2:#2a2e38;--mute:#a0a8b6;--line:#3b4150;
  --prim:#2f5be8;--hero:#1c2231;--toast:#2a2e38;
  --gbg:#10342a;--g:#63d9b0;--bbg:#3a1613;--b:#ff918a;--wbg:#392510;--w:#f5b56c;--ibg:#17254f;--i:#a3bcff;
  --hair:rgba(255,255,255,.08);--scrim:rgba(0,0,0,.6);
  --shell:#07080a;--shell-ink:#eef0f4;--shell-card:#14161c;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--shell);color:var(--shell-ink);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:16px 40px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none;-webkit-tap-highlight-color:transparent}
input,select{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- barra de herramientas del mock (fuera de la ventana) ---------- */
.tools{max-width:1920px;margin:0 auto 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tools h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.tools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.6;margin-right:4px}
.tchip{height:36px;padding:0 14px;border-radius:999px;background:var(--shell-card);font-size:14px;font-weight:600;white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--shell-ink);color:var(--shell)}
.tsel{height:36px;border-radius:999px;border:0;background:var(--shell-card);padding:0 14px;font-size:14px;font-weight:600;max-width:260px}

/* ---------- ventana escalada ---------- */
.frame{max-width:1920px;margin:0 auto;position:relative}
.stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--paper);color:var(--ink);border-radius:22px;overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.18);transition:background .3s ease,color .3s ease;font-size:16px;display:flex;flex-direction:column}
.winbar{height:38px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:600;color:var(--mute);background:var(--s)}
.winbar .dots{display:flex;gap:18px;font-size:15px}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;animation:scr .35s var(--ease) both}
.still,.still *{animation:none!important}
.still .pulse{animation:pulse 1.4s ease-in-out infinite!important}
.layer{display:contents}
@keyframes scr{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rv{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rv{animation:rv .45s var(--ease) both}

/* ---------- navbar ---------- */
.top{height:84px;flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 40px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.brand i{width:38px;height:38px;border-radius:12px;background:#121317;color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700}
:root[data-theme="dark"] .brand i{background:var(--blue)}
.nav{display:flex;gap:6px;background:var(--s);padding:5px;border-radius:999px}
.nav button{height:48px;padding:0 20px 0 16px;border-radius:999px;display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;color:var(--mute);letter-spacing:-.01em;transition:background .2s,color .2s,transform .3s var(--ease)}
.nav button:hover{color:var(--ink)}
.nav button:active{transform:scale(.97)}
.nav button[aria-current="page"]{background:var(--ibg);color:var(--blue);font-weight:700}
:root[data-theme="dark"] .nav button[aria-current="page"]{color:#a3bcff}
.nav button.venta{background:var(--blue);color:#fff;font-weight:700}
.nav button.venta[aria-current="page"]{background:var(--blue-d);color:#fff}
.nav button.venta:hover{color:#fff}
.right{display:flex;gap:10px;align-items:center;justify-content:flex-end}
.circ{width:48px;height:48px;border-radius:50%;background:var(--s);display:grid;place-items:center;position:relative;transition:transform .3s var(--ease)}
.circ:active{transform:scale(.95)}
.circ[aria-pressed="true"]{background:var(--ibg);color:var(--blue)}
.badge{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:#d92d20;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px var(--paper)}
.pill{height:48px;padding:0 22px;border-radius:999px;background:var(--s);font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:transform .3s var(--ease),background .2s}
.pill:active{transform:scale(.97)}
.pill.dark{background:var(--ink);color:var(--paper)}
.pill.blue{background:var(--blue);color:#fff}
.pill.sm{height:40px;padding:0 16px;font-size:14px}
.pill.lg{height:60px;font-size:17px;padding:0 28px}
.card .pill:not(.dark):not(.blue),.ticket .pill{background:var(--paper)}
.card .chip:not([aria-pressed="true"]){background:var(--paper)}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.estado{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--mute);margin-right:6px}
.estado i{width:8px;height:8px;border-radius:50%;background:#18a37f}

/* ---------- tipografía y piezas ---------- */
.h1{font-size:42px;font-weight:450;letter-spacing:-.055em;line-height:1;margin:0}
.h2{font-size:28px;font-weight:450;letter-spacing:-.045em;line-height:1.08;margin:0}
.sec{font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);margin:0}
.mute{color:var(--mute)}
.fig{font-weight:450;letter-spacing:-.055em;line-height:1;font-variant-numeric:tabular-nums}
.card{background:var(--s);border-radius:28px}
.hero{background:var(--hero);color:#fff;border-radius:34px;position:relative;overflow:hidden}
.hero .sub{color:rgba(255,255,255,.78)}
.chip{height:44px;padding:0 18px;border-radius:999px;background:var(--s);font-size:15px;font-weight:600;white-space:nowrap;transition:background .2s,transform .3s var(--ease)}
.chip:active{transform:scale(.97)}
.chip[aria-pressed="true"]{background:var(--prim);color:#fff}
.seg{display:inline-flex;gap:6px;padding:5px;border-radius:999px;background:var(--s)}
.seg button{height:46px;padding:0 24px;border-radius:999px;font-size:15px;font-weight:600;transition:background .2s}
.seg button[aria-pressed="true"]{background:var(--prim);color:#fff}
.list{display:flex;flex-direction:column;gap:1px;border-radius:28px;overflow:hidden;background:var(--hair)}
.list>*{background:var(--s)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 26px;font-size:17px}
.kv span:first-child{color:var(--mute)}
.kv b{font-weight:500;font-size:21px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.g{background:var(--gbg);color:var(--g)}.tag.b{background:var(--bbg);color:var(--b)}.tag.w{background:var(--wbg);color:var(--w)}.tag.i{background:var(--ibg);color:var(--i)}.tag.n{background:var(--paper);color:var(--mute)}
.ibox{width:44px;height:44px;border-radius:50%;background:var(--paper);display:grid;place-items:center;flex:none}
.ibox.sm{width:36px;height:36px}
svg.ic{flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;flex-direction:column;gap:4px;background:var(--s);border-radius:28px;padding:14px 22px 16px}
.field label{font-size:13px;font-weight:600;color:var(--mute)}
.field input,.field .val{background:none;border:0;outline:0;font-size:20px;font-weight:500;letter-spacing:-.02em;padding:0;width:100%}
.field input::placeholder{color:var(--mute);font-weight:500}
.field.big input{font-size:40px;font-weight:450;letter-spacing:-.05em;height:54px;font-variant-numeric:tabular-nums}
.search{display:flex;align-items:center;gap:12px;height:56px;border-radius:999px;background:var(--s);padding:0 22px;color:var(--mute)}
.search input{flex:1;background:none;border:0;outline:0;font-size:18px;font-weight:500;min-width:0}
.search input::placeholder{color:var(--mute)}
.kbd{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:7px;background:var(--paper);color:var(--mute);font-size:11.5px;font-weight:700;letter-spacing:.02em}
.tg{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 26px;min-height:72px;width:100%;text-align:left}
.tg .t{font-size:17px;font-weight:500}.tg .d{font-size:14px;color:var(--mute);margin-top:2px}
.track{width:56px;height:32px;border-radius:999px;background:var(--line);padding:3px;transition:background .25s;flex:none}
.track i{display:block;width:26px;height:26px;border-radius:50%;background:var(--paper);transition:transform .25s var(--ease)}
.track.on{background:var(--prim)}.track.on i{transform:translateX(24px)}
.bar{height:14px;border-radius:999px;background:var(--s2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stepper{display:inline-flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--paper)}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--s);display:grid;place-items:center}
.stepper b{min-width:56px;text-align:center;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;border-bottom:1.5px solid var(--line)}
.chk{width:30px;height:30px;border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);display:grid;place-items:center;flex:none;color:#fff;transition:background .2s}
.chk.on{background:var(--prim);box-shadow:none}

/* ---------- hoja inferior ---------- */
.veil{position:absolute;inset:38px 0 0;background:var(--scrim);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sheet{from{opacity:0;transform:scale(.96) translateY(10px)}to{opacity:1;transform:none}}
.sheet{width:760px;max-height:100%;background:var(--paper);border-radius:40px;padding:30px 32px 32px;display:flex;flex-direction:column;gap:14px;animation:sheet .35s var(--ease) both;box-shadow:0 30px 80px rgba(0,0,0,.28);overflow:hidden}
.sheet.wide{width:1040px}
.asa{display:none;width:44px;height:5px;border-radius:3px;background:#d3d7df;align-self:center;flex:none}
.sbody{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0;padding:2px}
.sfoot{display:flex;flex-direction:column;gap:8px;flex:none}
.btn-main{height:60px;border-radius:999px;background:var(--prim);color:#fff;font-size:17px;font-weight:600;transition:transform .3s var(--ease)}
.btn-main:active{transform:scale(.98)}
.btn-main.blue{background:var(--blue)}
.btn-main[disabled]{background:var(--s2);color:var(--mute);cursor:not-allowed}
.btn-sec{height:54px;border-radius:999px;background:var(--s);font-size:16px;font-weight:600}
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:60;background:var(--toast);color:#fff;padding:16px 26px;border-radius:26px;font-size:16px;font-weight:600;box-shadow:0 18px 40px rgba(18,19,23,.3);animation:toast .45s var(--ease) both;display:flex;gap:10px;align-items:center}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
.bloom{animation:bloom .6s var(--ease) both}
@keyframes bloom{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.tick path{stroke-dasharray:32;animation:tick .6s .25s ease both}
@keyframes tick{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}

/* ---------- Venta ---------- */
.venta{flex:1;min-height:0;display:grid;grid-template-columns:1fr 580px;gap:28px;padding:6px 40px 32px}
.vizq{display:flex;flex-direction:column;gap:16px;min-height:0;position:relative}
.vhead{display:flex;align-items:flex-end;justify-content:space-between}
.vcats{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;overflow:auto;min-height:0;padding:2px;align-content:start;flex:1}
.tile{background:var(--s);border-radius:28px;padding:16px 18px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:132px;position:relative;transition:transform .3s var(--ease),background .2s}
.tile:hover{background:var(--s2)}
.tile:active{transform:scale(.97)}
.tile .n{font-size:17px;font-weight:500;letter-spacing:-.02em;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .p{font-size:22px;font-weight:450;letter-spacing:-.04em;margin-top:auto;font-variant-numeric:tabular-nums}
.tile .m{font-size:13.5px;color:var(--mute);font-weight:500}
.tile .plus{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.tile.out{opacity:.5}
.drop{position:absolute;left:0;right:0;top:122px;z-index:20;background:var(--paper);border-radius:28px;box-shadow:0 24px 60px rgba(18,19,23,.22),0 0 0 1px var(--hair);padding:8px;animation:toast .35s var(--ease) both;transform-origin:top}
.drop button{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;border-radius:20px;font-size:17px}
.drop button.sel,.drop button:hover{background:var(--s)}
.drop .p{margin-left:auto;font-weight:500;font-size:19px;letter-spacing:-.03em}
.drop .st{font-size:13.5px;color:var(--mute);min-width:72px;text-align:right}
@keyframes toast2{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
.drop{animation:toast2 .3s var(--ease) both}
.vder{display:flex;flex-direction:column;gap:12px;min-height:0}
.cart{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.cl{background:var(--s);border-radius:24px;padding:12px 16px 12px 18px;display:grid;grid-template-columns:1fr auto auto auto;gap:4px 14px;align-items:center;animation:rv .4s var(--ease) both}
.cl.last{box-shadow:inset 0 0 0 2px var(--blue)}
.cl .n{font-size:17px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.cl .u{font-size:13.5px;color:var(--mute)}
.cl .sub{font-size:20px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.cl .rm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.cl .rm:hover{background:var(--paper);color:var(--b)}
.cl.neg .n{color:var(--b)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mute);text-align:center;background:var(--s);border-radius:28px;font-size:17px}
.total{padding:22px 26px;display:flex;flex-direction:column;gap:8px}
.total .lbl{font-size:15px;font-weight:600;color:rgba(255,255,255,.78);display:flex;justify-content:space-between;align-items:center}
.total .fig{font-size:62px;color:#fff}
.des{display:flex;gap:10px 18px;flex-wrap:wrap;font-size:14px;color:rgba(255,255,255,.8);font-weight:500}
.desc-btn{height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:600}
.medios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.medio{height:72px;border-radius:28px;background:var(--s);display:flex;align-items:center;gap:12px;padding:0 18px 0 12px;text-align:left;transition:transform .3s var(--ease),background .25s,color .25s}
.medio:active{transform:scale(.97)}
.medio .ibox{background:var(--paper);color:var(--ink);transition:background .25s,color .25s}
.medio .t{font-size:17px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.medio .k{font-size:11.5px;font-weight:700;opacity:.65;letter-spacing:.03em}
.medio[aria-pressed="true"]{color:#fff}
.medio[aria-pressed="true"] .ibox{background:rgba(255,255,255,.2);color:#fff}
.medio.efe[aria-pressed="true"]{background:var(--efe)}.medio.qr[aria-pressed="true"]{background:var(--blue)}
.medio.tar[aria-pressed="true"]{background:var(--tar)}.medio.mix[aria-pressed="true"]{background:var(--mix)}
.cobrar{height:68px;border-radius:999px;background:var(--blue);color:#fff;font-size:19px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 32px;transition:transform .3s var(--ease),background .2s}
.cobrar:hover{background:var(--blue-d)}.cobrar:active{transform:scale(.98)}
.cobrar[disabled]{background:var(--s2);color:var(--mute);cursor:not-allowed}
.cobrar .go{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}

/* ---------- pantallas de gestión ---------- */
.page{flex:1;min-height:0;padding:6px 40px 32px;display:flex;flex-direction:column;gap:20px;overflow:auto}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.cols{display:grid;gap:16px}
.row{display:flex;align-items:center;gap:14px;padding:14px 20px 14px 14px;border-radius:28px;background:var(--s);text-align:left;width:100%;transition:transform .3s var(--ease),background .2s}
.row:active{transform:scale(.99)}
.row.sel{background:var(--ibg)}
.row .t{font-size:17px;font-weight:500;letter-spacing:-.02em}
.row .d{font-size:14px;color:var(--mute);margin-top:2px}
.row .r{margin-left:auto;text-align:right;font-size:19px;font-weight:500;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);text-align:left;padding:14px 18px}
.tbl td{padding:15px 18px;font-size:16.5px;border-top:1px solid var(--hair);background:var(--s)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tr:first-child td{border-top:0}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.bars i{display:block;width:100%;border-radius:12px 12px 6px 6px;background:var(--s2);min-height:6px;transition:height .6s var(--ease)}
.bars i.hi{background:var(--blue)}
.bars span{font-size:12.5px;color:var(--mute);font-weight:600}
.ticket{background:var(--s);border-radius:28px;padding:26px 28px;display:flex;flex-direction:column;gap:12px}
.ticket .ln{display:flex;justify-content:space-between;gap:16px;font-size:16.5px;font-variant-numeric:tabular-nums}

  if(a==='mixtoOk'){S.medio='mixto';S.sheetData={canal:'debito'};return toTerminal('esperando')}
  if(a==='nuevaOk'){S.cart=[];S.last=null;S.sheet=null;S.payWith=0;S.sheetData={};return toast('Lista para la próxima venta')}
  if(a==='aperturaOk'){S.sheet=null;return toast('Caja abierta con '+$(30000))}
  if(a==='cantOk'){var l2=S.cart.filter(function(y){return y.id===S.sheetData.id})[0],v=parseInt(String(S.sheetData.v||'').replace(/\D/g,''),10);if(l2&&v>0)l2.qty=v;S.sheet=null;return draw()}
  if(a==='mp'){S.cierre.mp='243400';return draw()}
  if(a==='cerrado'){S.cierre.paso=3;return draw()}
 }
});
document.addEventListener('dblclick',function(e){var n=e.target.closest&&e.target.closest('[data-qty]');if(!n)return;var l=S.cart.filter(function(y){return y.id===n.dataset.qty})[0];S.sheet='cant';S.sheetData={id:l.id,v:String(l.qty)};draw()});
document.addEventListener('input',function(e){
 var t=e.target;
 if(t.id==='q'){S.q=t.value;S.dropIdx=0;return draw()}
 if(t.id==='gq'){S.gq=t.value;return draw()}
 if(t.dataset&&t.dataset.f){var raw=t.value.replace(/\D/g,'');var f=t.dataset.f;
  if(f==='pw'){S.payWith=raw?parseInt(raw,10):0}else if(f==='cq'){S.sheetData.v=raw}else if(f==='co'){S.sheetData.co=raw?parseInt(raw,10):0}else if(f==='pr'){S.sheetData.pr=raw?parseInt(raw,10):0}else{S.sheetData[f]=raw}
  return draw()}
 if(t.dataset&&t.dataset.c){S.cierre[t.dataset.c]=t.value.replace(/\D/g,'');return draw()}
});
document.addEventListener('change',function(e){if(e.target.id==='jump'&&e.target.value){jump(e.target.value);e.target.value=''}});
document.addEventListener('keydown',function(e){
 var inQ=e.target&&e.target.id==='q';
 if(e.key==='Escape'&&S.gs){S.gs=false;S.gq='';return draw()}
 if(e.ctrlKey&&(e.key==='f'||e.key==='F')&&S.screen!=='venta'){e.preventDefault();S.gs=true;S.gq='';draw();var g2=document.getElementById('gq');if(g2)g2.focus();return}
 if(e.key==='Escape'){if(S.sheet&&S.sheet!=='terminal'){S.sheet=null;return draw()}if(S.pop){S.pop=false;return draw()}if(S.q){S.q='';return draw()}}
 if(S.screen!=='venta'||S.sheet)return;
 if(e.ctrlKey&&(e.key==='f'||e.key==='F')){e.preventDefault();var q=document.getElementById('q');if(q)q.focus();return}
 if(e.altKey){var k=e.key.toLowerCase(),mm={e:'efectivo',q:'qr',d:'tarjeta',x:'mixto'};if(mm[k]){e.preventDefault();return setS({medio:mm[k]})}if(k==='v'){e.preventDefault();return setS({sheet:'varios'})}if(k==='i'){e.preventDefault();return setS({sheet:'movimiento',sheetData:{}})}}
 if(inQ){
  var pq=parseQ(S.q.trim()),r=S.q.trim()?P.filter(function(x){return (!pq.g||x.kg)&&norm(x.n).indexOf(pq.t)>=0}).slice(0,7):[];
  if(e.key==='ArrowDown'&&r.length){e.preventDefault();S.dropIdx=(S.dropIdx+1)%r.length;draw()}
  else if(e.key==='ArrowUp'&&r.length){e.preventDefault();S.dropIdx=(S.dropIdx+r.length-1)%r.length;draw()}
  else if(e.key==='Enter'){e.preventDefault();if(r.length&&r[S.dropIdx].st>0)addProd(r[S.dropIdx].id,pq.g);else if(!S.q.trim())openCobrar()}
 }
});
draw();
})();
</script>
