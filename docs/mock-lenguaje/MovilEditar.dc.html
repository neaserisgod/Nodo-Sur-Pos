<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar producto móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',system-ui,sans-serif;background:#f0f4f9;color:#1f1f1f}
a{color:#0b57d0}a:hover{color:#041e49}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f0f4f9; font-variant-numeric: tabular-nums;">

  <!-- Page behind, dimmed -->
  <div aria-hidden="true" style="padding: 22px 20px; display: flex; flex-direction: column; gap: 14px;">
    <span style="font-size: 17px; font-weight: 600;">‹  Proveedores</span>
    <span style="font-size: 24px; font-weight: 700;">Lácteos del Sur</span>
    <div style="height: 64px; border-radius: 16px; background: #ffffff;"></div>
  </div>
  <a href="MovilProveedor.dc.html" aria-label="Cerrar" style="position: absolute; inset: 0; background: rgba(31, 31, 31, 0.5);"></a>

  <!-- Bottom sheet -->
  <div role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; height: 740px; background: #ffffff; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; box-shadow: 0 -8px 32px rgba(15, 23, 42, 0.2);">
    <div style="display: flex; justify-content: center; padding: 10px 0 2px;"><span style="width: 40px; height: 5px; border-radius: 3px; background: #c4c7c5;"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px 20px;">
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <h2 id="sheet-title" style="margin: 0; font-size: 21px; font-weight: 700;">Editar producto</h2>
        <span style="font-size: 14px; color: #444746;">{{d.prov}}</span>
      </span>
      <a href="MovilProveedor.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 22px; background: #f0f4f9; color: #444746; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </a>
    </div>

    <div style="flex-grow: 1; overflow-y: auto; padding: 4px 20px 16px; display: flex; flex-direction: column; gap: 14px;">
      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 600; color: #444746;">Nombre</span>
        <input type="text" value="{{d.name}}" onChange="{{onName}}" style="height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #747775; font: inherit; font-size: 17px; font-weight: 600; color: #1f1f1f;">
      </label>

      <div style="background: #f8fafd; border: 1px solid #e3e3e3; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 14px; font-weight: 600; color: #444746;">Costo</span>
            <span style="display: flex; align-items: center; height: 54px; padding: 0 12px; border-radius: 14px; border: 1px solid #747775; background: #ffffff; gap: 4px;">
              <span style="font-size: 18px; color: #444746;">$</span>
              <input type="text" inputmode="numeric" value="{{d.costo}}" onChange="{{onCosto}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; font: inherit; font-size: 20px; font-weight: 700; color: #1f1f1f; background: transparent;">
            </span>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 14px; font-weight: 600; color: #444746;">Precio venta</span>
            <span style="display: flex; align-items: center; height: 54px; padding: 0 12px; border-radius: 14px; border: 2px solid #0b57d0; background: #ffffff; gap: 4px;">
              <span style="font-size: 18px; color: #444746;">$</span>
              <input type="text" inputmode="numeric" value="{{d.precio}}" onChange="{{onPrecio}}" style="flex-grow: 1; min-width: 0; border: none; outline: none; font: inherit; font-size: 20px; font-weight: 700; color: #1f1f1f; background: transparent;">
            </span>
          </label>
        </div>
        <span style="{{marginStyle}}">{{marginTxt}}</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <span style="font-size: 13px; color: #444746; flex-grow: 1;">Precio rápido</span>
          <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
            <button type="button" onClick="{{q.pick}}" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid #c4c7c5; background: #ffffff; color: #1f1f1f; font-size: 15px; font-weight: 700;">{{q.label}}</button>
          </sc-for>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <sc-for list="{{steppers}}" as="s" hint-placeholder-count="2">
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <span style="font-size: 14px; font-weight: 600; color: #444746;">{{s.label}}</span>
            <div style="display: flex; align-items: center; height: 54px; border-radius: 14px; border: 1px solid #747775; overflow: hidden;">
              <button type="button" onClick="{{s.dec}}" aria-label="{{s.decLabel}}" style="width: 48px; height: 54px; border: none; background: #f0f4f9; color: #1f1f1f; font-size: 22px; font-weight: 600;">−</button>
              <span style="flex-grow: 1; text-align: center; font-size: 20px; font-weight: 700;">{{s.value}}</span>
              <button type="button" onClick="{{s.inc}}" aria-label="{{s.incLabel}}" style="width: 48px; height: 54px; border: none; background: #f0f4f9; color: #1f1f1f; font-size: 22px; font-weight: 600;">+</button>
            </div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{dLow}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 14px; background: #fef1e0; color: #7a3a04; font-size: 14px; font-weight: 600;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></svg>
          Por debajo del mínimo: entra en el próximo pedido.
        </div>
      </sc-if>

      <label style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-size: 14px; font-weight: 600; color: #444746;">Código de barras</span>
        <span style="display: flex; align-items: center; gap: 8px;">
          <input type="text" inputmode="numeric" placeholder="Escribí el código" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid #747775; font: inherit; font-size: 16px; color: #1f1f1f;">
          <button type="button" aria-label="Escanear con la cámara" style="width: 52px; height: 52px; border-radius: 14px; border: 1px solid #747775; background: #ffffff; color: #1f1f1f; display: flex; align-items: center; justify-content: center; padding: 0;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>
          </button>
        </span>
      </label>
      <button type="button" style="height: 48px; border-radius: 24px; border: none; background: transparent; color: #b3261e; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Eliminar producto</button>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; padding: 12px 20px 20px; border-top: 1px solid #eceff3;">
      <a href="MovilProveedor.dc.html" style="height: 54px; border-radius: 27px; border: 1px solid #747775; color: #0b57d0; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center;">Cancelar</a>
      <a href="MovilProveedor.dc.html" style="height: 54px; border-radius: 27px; background: #1f1f1f; color: #ffffff; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center;">Guardar</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { draft: { name: 'Leche entera 1 L', prov: 'Lácteos del Sur', costo: '1050', precio: '1600', stock: 3, min: 15 } };
  }
  renderVals() {
    var self = this;
    var d = this.state.draft;
    var fmt = function (n) { return '$ ' + Math.round(n).toLocaleString('es-AR'); };
    var num = function (x) { return parseInt(String(x).replace(/\D/g, ''), 10) || 0; };
    var setDraft = function (p) { self.setState({ draft: Object.assign({}, self.state.draft, p) }); };
    var c = num(d.costo), p = num(d.precio), g = p - c, ok = c > 0 && g > 0;
    var stepper = function (key, label) {
      return {
        label: label, value: d[key], decLabel: 'Restar ' + label.toLowerCase(), incLabel: 'Sumar ' + label.toLowerCase(),
        dec: function () { var o = {}; o[key] = Math.max(0, self.state.draft[key] - 1); setDraft(o); },
        inc: function () { var o = {}; o[key] = self.state.draft[key] + 1; setDraft(o); }
      };
    };
    return {
      d: d,
      onName: function (e) { setDraft({ name: e.target.value }); },
      onCosto: function (e) { setDraft({ costo: e.target.value.replace(/\D/g, '') }); },
      onPrecio: function (e) { setDraft({ precio: e.target.value.replace(/\D/g, '') }); },
      marginTxt: ok ? 'Ganás ' + fmt(g) + ' por unidad · ' + Math.round(g / c * 100) + '%' : 'El precio no cubre el costo',
      marginStyle: 'display: flex; align-items: center; min-height: 40px; padding: 0 12px; border-radius: 12px; font-size: 15px; font-weight: 700; ' + (ok ? 'background: #e6f4ea; color: #0d652d;' : 'background: #fce8e6; color: #8c1d18;'),
      quick: [30, 40, 50].map(function (x) {
        return { label: '+' + x + '%', pick: function () { var cc = num(self.state.draft.costo); setDraft({ precio: String(Math.ceil(cc * (1 + x / 100) / 50) * 50) }); } };
      }),
      steppers: [stepper('stock', 'Stock actual'), stepper('min', 'Stock mínimo')],
      dLow: d.stock < d.min
    };
  }
}
</script>
</body>
</html>
