<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Menú móvil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav id="nav-menu" aria-label="Secciones" style="width: 358px; box-sizing: border-box; background: #ffffff; border-radius: 24px; padding: 8px; box-shadow: 0 16px 40px rgba(15, 23, 42, 0.22), 0 2px 6px rgba(15, 23, 42, 0.08); display: flex; flex-direction: column; gap: 2px; font-family: 'Figtree', system-ui, sans-serif; color: #1f1f1f;">
  <div style="padding: 10px 14px 8px; display: flex; flex-direction: column;">
    <span style="font-size: 15px; font-weight: 700;">La Plazoleta</span>
    <span style="font-size: 13px; color: #444746;">Punto de venta</span>
  </div>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
    <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.rowStyle}}">
      <span style="{{it.iconStyle}}">
        <sc-if value="{{it.isDash}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg></sc-if>
        <sc-if value="{{it.isVentas}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg></sc-if>
        <sc-if value="{{it.isCaja}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M16 12.5h2M3 10h18"/></svg></sc-if>
        <sc-if value="{{it.isSep}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M4 7h5v10H4zM15 4h5v16h-5z"/></svg></sc-if>
        <sc-if value="{{it.isProd}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></sc-if>
        <sc-if value="{{it.isProv}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h12v10H2zM14 10h4l4 4v2h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg></sc-if>
      </span>
      <span style="display: flex; flex-direction: column; flex-grow: 1;">
        <span style="{{it.labelStyle}}">{{it.label}}</span>
        <span style="{{it.subStyle}}">{{it.sub}}</span>
      </span>
      <sc-if value="{{it.active}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></sc-if>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["dashboard","separaciones","proveedores"],"default":"dashboard"},"$preview":{"width":358,"height":452}}'>
class Component extends DCLogic {
  renderVals() {
    var cur = this.props.current ?? 'dashboard';
    var DEF = [
      ['dashboard', 'Dashboard', 'Cómo viene el día', 'MovilDashboard.dc.html'],
      ['ventas', 'Ventas', 'Cobrar y ver tickets', '#'],
      ['caja', 'Caja', 'Apertura y cierre', '#'],
      ['separaciones', 'Separaciones', 'Qué apartar para proveedores', 'MovilSeparaciones.dc.html'],
      ['productos', 'Productos', 'Precios y stock', '#'],
      ['proveedores', 'Proveedores', 'Datos y productos', 'MovilProveedores.dc.html']
    ];
    return {
      items: DEF.map(function (d) {
        var on = d[0] === cur;
        return {
          label: d[1], sub: d[2], href: d[3], active: on, current: on ? 'page' : 'false',
          isDash: d[0] === 'dashboard', isVentas: d[0] === 'ventas', isCaja: d[0] === 'caja',
          isSep: d[0] === 'separaciones', isProd: d[0] === 'productos', isProv: d[0] === 'proveedores',
          rowStyle: 'display: flex; align-items: center; gap: 14px; height: 60px; padding: 0 14px; border-radius: 16px; text-decoration: none; ' + (on ? 'background: #d3e3fd; color: #041e49;' : 'color: #1f1f1f;'),
          iconStyle: 'width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; ' + (on ? 'background: #0b57d0; color: #ffffff;' : 'background: #f0f4f9; color: #444746;'),
          labelStyle: 'font-size: 16px; font-weight: ' + (on ? '700' : '600') + ';',
          subStyle: 'font-size: 13px; color: ' + (on ? '#0842a0' : '#5e5e5e') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
